openapi: 3.1.0
info:
  title: Snooze API
  version: 2.0.0
  summary: Log aggregation and alerting REST API.
  description: |
    The Snooze v1 HTTP API. Snooze 2.0 is a Go rewrite of the Python 1.x
    server; this document describes the **v1** wire contract that ships
    with 2.0.

    ## Authentication

    Every endpoint outside the small "public" set (`/healthz`,
    `/readyz`, `/metrics`, `/api/v1/login/*`) requires a bearer JWT:

    ```
    Authorization: Bearer <token>
    ```

    Tokens are obtained via `POST /api/v1/login/{local,ldap,anonymous}`.
    The Python 1.x `Authorization: JWT <token>` scheme is no longer
    accepted.

    ## Multi-tenancy

    Snooze supports multiple isolated organizations (tenants) on a single
    server. Every authenticated request is scoped to the tenant encoded in
    the `tenant_id` JWT claim. Pass the `org` field in the login request
    body to obtain a token scoped to a specific tenant; omit `org` (or leave
    it blank) to land in the `default` tenant.

    **Ingest routing** — unauthenticated alert ingestion (`POST /api/v1/alerts`,
    `POST /api/v1/webhook/*`) is routed to a tenant by the `Authorization:
    Bearer <ingest_token>` header, where `<ingest_token>` is the per-tenant
    opaque token stored in the tenant document. When no token is supplied or
    the token is unknown, the request falls back to the `default` tenant.

    **Platform permissions** — the `ro_tenant` and `rw_tenant` permissions gate
    the `/api/v1/tenant` registry endpoints. These are platform-tier permissions,
    independent of any tenant. The seeded `platform_admin` role holds both.

    ## CRUD shape

    Most plugins expose the same six verbs under
    `/api/v1/{plugin}`:

    * `GET    /api/v1/{plugin}` — list (paginated).
    * `POST   /api/v1/{plugin}` — create.
    * `DELETE /api/v1/{plugin}` — bulk delete by query.
    * `POST   /api/v1/{plugin}/search` — search with a JSON body.
    * `GET    /api/v1/{plugin}/{uid}` — fetch one.
    * `PUT    /api/v1/{plugin}/{uid}` — full replace.
    * `PATCH  /api/v1/{plugin}/{uid}` — partial update.
    * `DELETE /api/v1/{plugin}/{uid}` — delete one.

    A number of plugins (`alertmanager`, `azuremonitor`, `cloudwatch`,
    `datadog`, `grafana`, `influxdb2`, `kapacitor`, `newrelic`,
    `pingdom`, `prometheus`, `sentry`, `stackdriver`) replace the generic CRUD with an inbound
    webhook surface under `/api/v1/webhook/{name}`; the `heartbeat`
    plugin exposes a token-gated ping at `/api/v1/webhook/heartbeat`. The
    `slackinteractive` and `telegraminteractive` receivers
    (`/api/v1/webhook/slack`, `/api/v1/webhook/telegram`) apply ack/close/re-open
    actions from chat message buttons and authenticate each request with the
    chat platform's own signature/secret header (fail closed: an unset secret
    rejects every request).

    ## Conditions (the `q` parameter)

    `q` is a base64url-encoded JSON document describing a condition.
    The grammar is the same AST the Python `Condition` model used:

    ```json
    {"type": "AND", "args": [
       {"type": "EQUALS", "field": "host", "value": "srv-1"},
       {"type": "MATCHES", "field": "message", "value": "^ERROR"}
    ]}
    ```

    `POST /api/v1/{plugin}/search` accepts the same shape as a JSON
    body field (`condition`) so clients can avoid URL-length limits.

  contact:
    name: Snooze maintainers
    url: https://github.com/snoozeweb/snooze/issues
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.txt

servers:
  - url: https://snooze.example.com
    description: Production deployment (path prefix optional)
  - url: http://localhost:5200
    description: Local development

security:
  - bearerAuth: []
  # Trusted-header (auth-proxy) mode is an alternative to a Bearer token on
  # every authenticated route, but only when auth_proxy.enabled=true and the
  # immediate TCP peer is a trusted proxy. Disabled by default.
  - proxyHeader: []

tags:
  - name: health
    description: Liveness and readiness probes.
  - name: auth
    description: Login + token issuance.
  - name: telemetry
    description: Metrics and tracing endpoints.
  - name: alerts
    description: Alert ingestion (POST /api/v1/alerts).
  - name: webhooks
    description: Inbound webhook receivers for foreign monitoring sources.
  - name: crud
    description: Generic per-plugin REST CRUD surface.
  - name: schema
    description: JSON Schema discovery + permission enumeration.
  - name: platform
    description: Platform-level tenant registry CRUD (requires ro_tenant / rw_tenant).

paths:

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: |
        Returns 200 as long as the process is up. Used by Kubernetes
        liveness probes and Docker healthchecks. Always public.
      security: []
      responses:
        '200':
          description: Process alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusOK'}

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Polls the database driver with a 2s timeout. Used by
        Kubernetes readiness probes. Always public.
      security: []
      responses:
        '200':
          description: Server ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusOK'}
        '503':
          description: Database unreachable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/health:
    get:
      tags: [health]
      summary: Verbose health check
      description: |
        Per-subsystem status: database, registered plugins, optional
        syncer cluster view.
      security: []
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  subsystems:
                    type: object
                    additionalProperties:
                      type: string
                  plugins:
                    type: array
                    items: {type: string}

  /api/v1/version:
    get:
      tags: [health]
      summary: Build version info
      description: |
        Returns the compiled-in version string, git commit hash, and
        build date. Always public (no bearer token required). Use this
        endpoint to verify which binary is running on each cluster node
        or to display the version in the web UI.
      security: []
      responses:
        '200':
          description: Version metadata.
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, date]
                properties:
                  version:
                    type: string
                    example: "2.3.1"
                  commit:
                    type: string
                    example: "abc1234"
                  date:
                    type: string
                    example: "2026-06-26T10:00:00Z"

  /metrics:
    get:
      tags: [telemetry]
      summary: Prometheus metrics
      description: |
        Prometheus text-format exposition. Backed by the
        `prometheus.Registry` constructed at startup. Always public.
      security: []
      responses:
        '200':
          description: Metrics payload.
          content:
            text/plain:
              schema:
                type: string

  /api/v1/login:
    get:
      tags: [auth]
      summary: List enabled authentication backends and public tenants
      description: |
        Returns the names of registered authentication providers, with
        the configured `general.default_auth_backend` first, plus the
        list of active tenants whose `listed` flag is true (or absent).
        The `login_key` is never included here.
      security: []
      responses:
        '200':
          description: Backend list and public tenant list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      backends:
                        type: array
                        items:
                          type: object
                          required: [name, kind]
                          properties:
                            name: {type: string, example: microsoft}
                            kind: {type: string, enum: [password, redirect]}
                            display_name: {type: string, example: "Microsoft 365"}
                            icon: {type: string, example: microsoft}
                      tenants:
                        type: array
                        description: |
                          Active tenants with listed:true (or absent). Sorted
                          by display_name. Empty array when there is only the
                          default tenant or none are listed.
                        items:
                          type: object
                          required: [id, display_name]
                          properties:
                            id:
                              type: string
                              description: "Tenant slug."
                            display_name:
                              type: string
                              description: "Human-readable label."
                      tenant_match_enabled:
                        type: boolean
                        description: |
                          Present and true when at least one tenant_match
                          routing rule exists, so the login UI can tell the
                          user that organization routing is automatic. Omitted
                          when no rules are defined.

  /api/v1/login/tenant:
    get:
      tags: [auth]
      summary: Resolve an opaque per-tenant login key
      description: |
        Resolves a per-tenant `login_key` to the tenant's `id` and
        `display_name`. Returns a generic 404 for an empty, unknown, or
        suspended tenant — it never resolves by slug, so it cannot be
        used to enumerate tenants. Used by the login page when the URL
        carries `?key=<login_key>`.
      security: []
      parameters:
        - name: key
          in: query
          required: true
          schema: {type: string}
          description: "The opaque per-tenant login key."
      responses:
        '200':
          description: Tenant identity for the given key.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, display_name]
                    properties:
                      id:
                        type: string
                        description: "Tenant slug."
                      display_name:
                        type: string
                        description: "Human-readable label."
        '404':
          description: Key not found, empty, or tenant suspended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/login/{provider}/start:
    get:
      tags: [auth]
      summary: Begin an OIDC redirect login
      description: |
        Initiates an OAuth 2.0 / OIDC authorization-code flow for the named
        provider (e.g. `microsoft`). Sets a short-lived signed state cookie
        and issues a 302 redirect to the identity provider's authorize endpoint.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
          description: "The configured `method` value (e.g. `microsoft`)."
        - name: return_to
          in: query
          required: false
          schema: {type: string}
          description: "Relative SPA path to return to after sign-in. If omitted, the SPA lands on /web/alerts."
        - name: org
          in: query
          required: false
          schema: {type: string}
          description: "Tenant slug. Omit to use the default tenant."
      responses:
        '302':
          description: Redirect to the identity provider's authorize endpoint. Sets a short-lived signed state cookie.

  /api/v1/login/{provider}/callback:
    get:
      tags: [auth]
      summary: OIDC redirect callback
      description: |
        Receives the authorization-code callback from the identity provider.
        Exchanges the code for tokens, validates the ID token, resolves or
        creates the Snooze user, and issues a signed session JWT.

        On success, redirects to `/web/login/callback#token=<jwt>`.
        On failure, redirects to `/web/login?sso_error=<message>`.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
          description: "The configured `method` value (e.g. `microsoft`)."
        - name: code
          in: query
          required: false
          schema: {type: string}
          description: "Authorization code returned by the identity provider."
        - name: state
          in: query
          required: false
          schema: {type: string}
          description: "CSRF state token. Must match the signed state cookie."
        - name: error
          in: query
          required: false
          schema: {type: string}
          description: "Error code returned by the identity provider on failure."
      responses:
        '302':
          description: On success, redirect to /web/login/callback with the session token in the URL fragment. On failure, redirect to /web/login?sso_error=...

  /api/v1/login/{provider}/acs:
    post:
      tags: [auth]
      summary: SAML2 Assertion Consumer Service (ACS)
      description: |
        Consumes the IdP's SP-initiated SAML2 response. The IdP POSTs a base64
        `SAMLResponse` and the echoed `RelayState` as a urlencoded form. The
        server constant-time compares `RelayState` against the signed
        RelayState cookie (CSRF defence), validates the assertion's signature,
        audience, conditions and NotOnOrAfter, maps the NameID + group/role
        attributes to a Snooze identity, JIT-provisions the user, and mints a
        session.

        On success, redirects to `/web/login/callback#token=<jwt>`.
        On RelayState mismatch, a bad/expired assertion, or a disabled user,
        redirects to `/web/login?sso_error=<message>` and mints no token.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
          description: "The configured SAML `method` value (e.g. `saml`)."
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: "Base64-encoded SAML2 Response (signed assertion)."
                RelayState:
                  type: string
                  description: "Opaque RelayState echoed by the IdP; must match the signed cookie."
      responses:
        '302':
          description: On success, redirect to /web/login/callback with the session token in the URL fragment. On failure, redirect to /web/login?sso_error=...

  /api/v1/login/{provider}/metadata:
    get:
      tags: [auth]
      summary: SAML2 SP metadata (EntityDescriptor)
      description: |
        Returns the Service Provider's SAML2 `EntityDescriptor` XML so an IdP
        administrator can register Snooze in one paste. Lists the ACS endpoint
        and (when an SP signing cert is configured) the SP signing certificate.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
          description: "The configured SAML `method` value (e.g. `saml`)."
      responses:
        '200':
          description: SP EntityDescriptor XML.
          content:
            text/xml:
              schema: {type: string}

  /api/v1/login/local:
    post:
      tags: [auth]
      summary: Local user login (bcrypt-hashed password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Bearer JWT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/login/ldap:
    post:
      tags: [auth]
      summary: LDAP login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Bearer JWT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: LDAP bind / search failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
        '409':
          description: Backend disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/login/anonymous:
    post:
      tags: [auth]
      summary: Anonymous login
      description: |
        Issues a bearer JWT with the `anonymous` method, used when
        `general.anonymous_enabled: true`. No request body.
      security: []
      responses:
        '200':
          description: Anonymous bearer JWT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '404':
          description: Anonymous backend not registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/login/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access+refresh pair
      description: |
        Validates the supplied refresh token, revokes it, and issues a
        fresh access token alongside a rotated refresh token. The caller
        must replace its stored pair with the new one — the previous
        refresh token is no longer valid. An invalid, expired, revoked
        or unknown token returns 401 with a generic message.

        Roles and permissions are re-resolved on every refresh so an
        admin's revocation of a permission takes effect within the
        access-token lease (default 1 hour).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: New access + refresh pair.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: Invalid, expired, revoked or unknown refresh token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/login/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      description: |
        Best-effort revocation of the supplied refresh token. Unknown or
        already-revoked tokens are treated as no-ops — the endpoint
        always returns 204 so a client cleaning up state never sees a
        500. The access token (Bearer JWT) is not revoked: it continues
        to be valid until its own expiry. Clients should drop both
        tokens client-side after calling this endpoint.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '204':
          description: Logout acknowledged (idempotent).

  /api/v1/user/me/password:
    post:
      tags: [auth]
      summary: Self-service password change
      description: |
        Replaces the authenticated user's password. Only available when
        the caller's JWT `method` claim is `local` — LDAP / anonymous
        accounts are managed by their backing provider.

        The caller MUST supply their current password; the server
        re-runs the bcrypt comparison through the same code path as
        `/api/v1/login/local`, so the failure mode (and timing) is
        identical to a bad-credentials login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password:
                  type: string
                  description: The caller's current password.
                password:
                  type: string
                  description: The new password (bcrypt-hashed server-side).
      responses:
        '204':
          description: Password updated.
        '401':
          description: Missing claims or wrong current password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
        '403':
          description: |
            Caller's auth method is not `local`; self-service password
            change is not available for that backend.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
        '422':
          description: Empty body field(s).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/user/me/apikeys:
    get:
      tags: [auth]
      summary: List my API keys
      responses:
        '200':
          description: The caller's API keys (secrets stripped).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/APIKey'}
    post:
      tags: [auth]
      summary: Create an API key for myself
      description: >
        Mints a key scoped to the caller, carrying a subset of the caller's own
        permissions. The raw key is returned once. Not permitted when the
        request is itself authenticated with an API key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/APIKeyCreate'}
      responses:
        '201':
          description: Created. Body includes the raw `key` (shown once).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyCreated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Invalid expiry, or requested permissions are malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
  /api/v1/user/me/apikeys/{id}:
    delete:
      tags: [auth]
      summary: Revoke one of my API keys
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted.
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/action/test:
    post:
      tags: [crud]
      summary: Send a test notification for an action config
      description: |
        Delivers a single synthetic alert through the notifier named by
        `selected`, using `subcontent` as its action_form configuration. The
        config does NOT need to be persisted first — this powers the
        "Send test" button in the Actions editor. The notifier's real Send
        path runs, so a 200 proves end-to-end delivery (URL, auth, payload).
        No record is mutated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected:
                  type: string
                  description: Notifier plugin registry key (teams, slack, webhook, …).
                subcontent:
                  type: object
                  additionalProperties: true
                  description: The action_form values for that notifier.
      responses:
        '200':
          description: |
            Test notification delivered. The test send bypasses batching and
            reports the real transport outcome, so a 200 always means the
            notifier accepted the alert — there is no deferred "queued" state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        '404':
          description: Unknown plugin.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
        '422':
          description: Plugin is not a notifier, or upstream delivery failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/alerts:
    post:
      tags: [alerts]
      summary: Submit one or many alert records
      description: |
        Accepts a single record object or an array of records. Each
        record is run through the configured `core.process_plugins`
        pipeline; the response includes the post-pipeline records and
        any per-record processing errors.

        **Multi-tenant routing** — in a multi-tenant deployment, supply
        `Authorization: Bearer <ingest_token>` (the per-tenant opaque token
        from `GET /api/v1/tenant/{id}`) to route ingestion to a specific
        tenant. When no token is present or the token is unknown, the request
        falls back to the `default` tenant. Single-tenant deployments need no
        token (existing behaviour preserved).

        **Alert federation** — relayed alerts carry an `X-Snooze-Loop` request
        header: a comma-separated chain of the `syncer.hostname` server ids the
        alert has already traversed. A `snoozepeer` notification action appends
        this server's id before relaying to a peer; if this server's own id is
        already in the chain the alert is accepted and persisted (HTTP 200) but
        **not** re-relayed, breaking loops in cyclic (hub-and-spoke /
        active-active) topologies. Direct (non-federated) submitters omit the
        header.
      security:
        - {}
        - ingestToken: []
      parameters:
        - name: X-Snooze-Loop
          in: header
          required: false
          description: |
            Comma-separated chain of `syncer.hostname` server ids a relayed
            alert has already traversed (set by the `snoozepeer` federation
            notification action). Omit when submitting alerts directly.
          schema: {type: string}
          example: "hub-eu,hub-us"
      requestBody:
        required: true
        description: |
          A record may carry any extra (non-schema) keys; they are preserved and
          exposed to rules and templates. The reserved ingest hint
          `_preserve_raw: true` copies every extra key into the record's `raw`
          field before rules run (the original foreign payload is archived for
          audit) and is itself stripped from the stored record. See the
          [Custom source mapping](/docs/general/integrations/custom-source) guide.
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/Record'}
                - type: array
                  items: {$ref: '#/components/schemas/Record'}
      responses:
        '200':
          description: |
            Per-record processing result. Records that were silently discarded
            (e.g. by a `snooze` discard rule) are omitted from `data` without
            an entry in `errors`. Mixed batches where some records pass and
            some are policy-rejected return 200 with the rejections in `errors`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Record'}
                  errors:
                    type: array
                    items: {type: string}
        '422':
          description: |
            All records in the batch were rejected by an enabled `reject` policy
            rule. The response body carries code `policy_rejected` and a message
            containing the matching rule name. Fix the alert or contact the
            operator to adjust the policy rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
              example:
                error:
                  code: policy_rejected
                  message: "policy_rejected: blacklist-untrusted-source"
        '503':
          $ref: '#/components/responses/IngestDisabled'

  /api/v1/cluster/status:
    get:
      tags: [health]
      summary: Cluster + plugin status
      description: |
        Cluster member list (graded ok/degraded/down from the `nodes`
        heartbeat collection; leader = alphabetically-first ok member — Snooze
        has no real leader election) plus the loaded-plugin roster. Falls back
        to a synthetic `standalone` member on a single-node deploy. Backs the
        admin Status page.
      responses:
        '200':
          description: Cluster status snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cluster:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            status: {type: string, enum: [ok, degraded, down]}
                      leader: {type: string}
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        loaded: {type: boolean}

  /api/v1/condition/parse:
    post:
      tags: [crud]
      summary: Parse a search-bar query string into a Condition AST
      description: |
        Always returns 200 (even on a query parse error) so the SearchBar can
        render an inline marker. A 400 is returned only when the JSON envelope
        itself is malformed. Exactly one of `condition` / `error` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
      responses:
        '200':
          description: Parse result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  condition: {type: object, additionalProperties: true}
                  error:
                    type: object
                    properties:
                      pos: {type: integer}
                      token: {type: string}
                      message: {type: string}

  /api/v1/condition/fields:
    get:
      tags: [crud]
      summary: Field catalog for SearchBar autocomplete
      parameters:
        - name: collection
          in: query
          required: false
          schema: {type: string, default: record}
      responses:
        '200':
          description: Field catalog (empty array for unknown collections).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        type: {type: string}
                        description: {type: string}
                        values: {type: array, items: {type: string}}

  /api/v1/snooze:
    get:
      tags: [crud]
      summary: List snooze filters with computed window status
      description: |
        Snooze filters follow the generic CRUD surface (`/api/v1/{plugin}`) for
        create / replace / patch / delete / search, but the list and get-one
        responses additionally carry two computed, read-only fields:
        `window_status` (`active` / `pending` / `expired` / `always_on`) and
        `remaining_seconds` (seconds until the active window closes). Both are
        projected at read time from the whole `time_constraints` group (the same
        predicate the pipeline suppresses on — datetime, daily-time and weekday
        families AND'd, in `time_constraints.tz` when set); neither is stored.
      parameters:
        - {$ref: '#/components/parameters/QueryQ'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/OrderBy'}
        - {$ref: '#/components/parameters/Asc'}
      responses:
        '200':
          description: Paginated list; each item carries window_status + remaining_seconds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Snooze'}
                  meta: {$ref: '#/components/schemas/ListMeta'}
        '400':
          description: Malformed query.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/snooze/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [crud]
      summary: Fetch a single snooze with its computed window status
      description: |
        Like the generic get-one, but the returned document additionally
        carries the read-only computed `window_status` and `remaining_seconds`
        fields.
      responses:
        '200':
          description: Snooze document with window_status + remaining_seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snooze'}
        '404':
          description: Not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/snooze/{uid}/retro_apply:
    post:
      tags: [crud]
      summary: Replay a stored snooze against existing records
      description: |
        Applies the snooze's condition to the `record` collection: deletes
        matches when `discard` is true, otherwise tags them `snoozed:<name>`.
        Requires the `rw_record` permission.
      parameters:
        - name: uid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Retro-apply counts.
          content:
            application/json:
              schema:
                type: object
                required: [matched, snooze]
                properties:
                  matched: {type: integer}
                  deleted: {type: integer}
                  tagged: {type: integer}
                  snooze: {type: string}
        '404':
          description: Snooze not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/group:
    get:
      tags: [crud]
      summary: List server-managed user groups
      description: |
        Server-managed groups follow the generic CRUD surface
        (`/api/v1/{plugin}`) for create / replace / patch / delete / search.
        Each group carries `{name, description, members[]}`; membership is folded
        into a user's group set at login (see the `Group` schema). Requires the
        `ro_group` permission.
      parameters:
        - {$ref: '#/components/parameters/QueryQ'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/OrderBy'}
        - {$ref: '#/components/parameters/Asc'}
      responses:
        '200':
          description: Paginated list of groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
                  meta: {$ref: '#/components/schemas/ListMeta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [crud]
      summary: Create a server-managed user group
      description: |
        Creates a group `{name, description, members[]}`. The `(tenant_id, name)`
        pair must be unique (duplicate names are rejected). Requires `rw_group`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Group'}
      responses:
        '200':
          description: The created group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/group/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [crud]
      summary: Fetch a single group
      responses:
        '200':
          description: The group document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [crud]
      summary: Replace a group
      description: Full replacement of the group document. Requires `rw_group`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Group'}
      responses:
        '200':
          description: The replaced group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [crud]
      summary: Partially update a group
      description: |
        Partial update — e.g. PATCH `{"members": [...]}` to add or remove members
        without touching `name`/`description`. Requires `rw_group`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Group'}
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [crud]
      summary: Delete a group
      description: |
        Removes the group document. User documents are untouched; members simply
        lose this group's membership at their next login. Requires `rw_group`.
      responses:
        '200':
          description: Deletion count.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusOK'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/record/bulk_state:
    post:
      tags: [crud]
      summary: Bulk state change across a query
      description: |
        Sets `state` on every `record` matching the `q` condition in a single
        call, returning the matched/updated counts. `state` must be one of
        `ack`, `close`, `open`, `esc`; anything else is rejected with a 400.
        The timed-shelve pair is deliberately NOT accepted here: `shelve` needs
        a `shelve_until` deadline stamped alongside the state, and this endpoint
        writes `state` and nothing else — shelve through the per-record comment
        path instead. Requires the `rw_record` permission (the `rw_all` wildcard
        also satisfies it).

        Unlike posting a state-changing comment per record, the bulk path sets
        `state` directly and does **not** fan out one comment per record (a
        query can match thousands of rows); the optional `message` is recorded
        once in the audit summary instead. One audit row is written per affected
        record (subject to a server-side cap above which a single summary row is
        written).
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            base64url-encoded JSON condition (same shape as the list `q`
            parameter). Omit to match every record the caller's tenant can see.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [ack, close, open, esc]
                message:
                  type: string
                  description: Recorded once in the audit summary.
      responses:
        '200':
          description: Bulk state-change counts.
          content:
            application/json:
              schema:
                type: object
                required: [matched, updated, state]
                properties:
                  matched: {type: integer}
                  updated: {type: integer}
                  state: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/{plugin}/bulk_update:
    post:
      tags: [crud]
      summary: Bulk attribute / tag update across a query
      description: |
        Applies an attribute merge (`set`), an idempotent tag add (`tag`), and a
        tag removal (`untag`) to every document of `{plugin}`'s collection
        matching the `q` condition, in that order, in a single call. At least
        one of `set` / `tag` / `untag` must be present. `{plugin}` must be a
        registered data-model collection (notifiers, the audit log, etc. are
        rejected). Requires the `rw_{plugin}` permission (the `rw_all` wildcard
        also satisfies it).

        Tag add is idempotent: a record already carrying the tag ends with
        exactly one copy of it. One audit row is written per affected record
        when the plugin enables auditing (subject to a server-side cap above
        which a single summary row is written).
      security:
        - bearerAuth: []
      parameters:
        - name: plugin
          in: path
          required: true
          description: The data-model collection name (e.g. `record`).
          schema: {type: string}
        - name: q
          in: query
          required: false
          description: |
            base64url-encoded JSON condition. Omit to match every document the
            caller's tenant can see.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                set:
                  type: object
                  additionalProperties: true
                  description: Field/value pairs merged onto every match.
                tag:
                  type: array
                  items: {type: string}
                  description: Tags to add (idempotent).
                untag:
                  type: array
                  items: {type: string}
                  description: Tags to remove.
      responses:
        '200':
          description: Per-op bulk-update counts.
          content:
            application/json:
              schema:
                type: object
                required: [matched, set, tagged, untagged]
                properties:
                  matched: {type: integer}
                  set: {type: integer}
                  tagged: {type: integer}
                  untagged: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/housekeeping/run:
    post:
      tags: [admin]
      summary: Trigger an on-demand housekeeping cycle
      operationId: runHousekeeping
      description: |
        Fires every registered housekeeping job synchronously and returns the
        per-job results. Requires the `rw_all` permission. HTTP 200 is returned
        even when individual jobs failed — failures are surfaced in each job's
        `error` field and the top-level `errors` count. Returns 503 when the
        housekeeper is not wired.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All registered jobs were invoked (per-job errors in body).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        error: {type: string}
                        duration_ms: {type: integer}
                  errors: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/housekeeping/status:
    get:
      tags: [admin]
      summary: Report housekeeper registration status
      operationId: housekeepingStatus
      description: |
        Reports whether the housekeeper is wired and, when it is, how many jobs
        are registered. Requires the `rw_all` permission. Returns 503 when the
        housekeeper is not wired.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Housekeeper is wired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  registered_jobs: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/tenant:
    get:
      tags: [platform]
      summary: List tenants
      description: |
        Returns all tenant records. Requires `ro_tenant` or `rw_tenant`.
        Evaluated against platform scope, not any individual tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: query
          schema: {type: integer, default: 0}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: orderby
          in: query
          schema: {type: string}
        - name: asc
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [platform]
      summary: Create tenant
      description: |
        Creates a new organization and seeds its default roles (`admin`,
        `viewer`, `notifications`). Requires `rw_tenant`. The `id` slug must be
        unique and must not be `default`. If `ingest_token` is omitted a random
        token is generated and returned in the response — this is the only
        opportunity to retrieve it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/tenant/{id}/admin:
    post:
      tags: [platform]
      summary: Ensure/reset a tenant's local admin password
      description: |
        Provisions or resets the local admin for the given tenant. If the
        user identified by `username` (default "admin") already exists its
        password is rotated; otherwise a new local user is created with the
        `admin` role. Requires `rw_tenant`. The returned `password` is shown
        exactly once — store it immediately.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: "Tenant slug."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: "Admin username to provision or reset (default \"admin\")."
      responses:
        '200':
          description: Admin credential (password shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredential'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/tenant/{id}/rotate-login-key:
    post:
      tags: [platform]
      summary: Rotate a tenant's login key
      description: |
        Generates a fresh opaque `login_key` for the tenant, invalidating
        any previously shared login links. Also bootstraps a key for tenants
        that were created before this feature was introduced. Requires
        `rw_tenant`. The new key is returned in the response — update any
        shared login links immediately.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: "Tenant slug."
      responses:
        '200':
          description: New login key.
          content:
            application/json:
              schema:
                type: object
                required: [id, login_key]
                properties:
                  id:
                    type: string
                    description: "Tenant slug."
                  login_key:
                    type: string
                    description: "Freshly generated opaque login key."
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/tenant/{id}:
    get:
      tags: [platform]
      summary: Get tenant by id
      description: Requires `ro_tenant` or `rw_tenant`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [platform]
      summary: Update tenant display_name / status / ingest_token / listed
      description: Requires `rw_tenant`. `id` is immutable.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [platform]
      summary: Delete tenant
      description: |
        Requires `rw_tenant`. The reserved "default" tenant cannot be deleted
        (server returns 409).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/tenant_match:
    get:
      tags: [platform]
      summary: List attribute→tenant routing rules
      description: |
        Returns all `tenant_match` rules. The collection is global (platform
        scope, not per-tenant). Requires `ro_tenant` or `rw_tenant`.
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: query
          schema: {type: integer, default: 0}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
        - name: orderby
          in: query
          schema: {type: string}
        - name: asc
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantMatchRule'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [platform]
      summary: Create a routing rule
      description: |
        Creates an attribute→tenant routing rule. Requires `rw_tenant`. The
        `(match_type, match)` pair must be unique (a duplicate returns 409) and
        `tenant_id` must name an existing tenant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMatchRule'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantMatchRule'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/tenant_match/{uid}:
    get:
      tags: [platform]
      summary: Get a routing rule by uid
      description: Requires `ro_tenant` or `rw_tenant`.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMatchRule'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [platform]
      summary: Update a routing rule
      description: Requires `rw_tenant`.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantMatchRule'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMatchRule'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [platform]
      summary: Delete a routing rule
      description: Requires `rw_tenant`.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/webhook/{webhook}:
    post:
      tags: [webhooks]
      summary: Inbound webhook receiver
      description: |
        Convert a foreign monitoring source's alert payload into one or
        more Snooze records and submit them to the pipeline. The
        payload schema is source-specific; see each integration's
        documentation for the wire format.

        Receivers are unauthenticated by default. When `ingest.token` is
        configured every request must carry it as
        `Authorization: Bearer <token>` or `?token=<token>`.

        **Multi-tenant routing** — supply a per-tenant `ingest_token` (from
        `GET /api/v1/tenant/{id}`) to route webhook payloads to a specific
        tenant. Falls back to `default` when absent or unknown. The global
        `ingest.token` guard (if configured) is evaluated first.
      security:
        - {}
        - ingestToken: []
      parameters:
        - name: webhook
          in: path
          required: true
          schema:
            type: string
            enum:
              - alertmanager
              - azuremonitor
              - cloudwatch
              - datadog
              - grafana
              - graylog
              - influxdb2
              - kapacitor
              - newrelic
              - pagerduty
              - pingdom
              - prometheus
              - sentry
              - stackdriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Records accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Record'}
        '503':
          $ref: '#/components/responses/IngestDisabledWebhook'

  /api/v1/webhook/pagerduty:
    post:
      tags: [webhooks]
      summary: PagerDuty status-sync inbound webhook
      description: |
        Accepts PagerDuty webhook v2 (`messages[]`) payloads and applies
        ack/close/re-open state transitions to matching Snooze records. Each
        message's `data.incident.incident_key` locates the originating record
        (matched against `record.hash`, falling back to `record.uid` — the same
        dedup-key convention the outbound notifier uses). The event type maps to
        a Snooze state:

        | PagerDuty event type | Snooze state |
        |----------------------|--------------|
        | `incident.acknowledge` | `ack` |
        | `incident.resolve` | `close` |
        | `incident.trigger` / `incident.unacknowledge` / `incident.escalate` | re-open (state cleared) |
        | `incident.assign` / `incident.delegate` / unknown | ignored (no-op) |

        Unknown event types are a fail-open no-op (200 OK, no write) so a Snooze
        upgrade never causes PagerDuty to retry forever. Like every receiver,
        this endpoint is unauthenticated by default and gated by `ingest.token`
        when configured. No PagerDuty webhook signature is validated.
      security:
        - {}
        - ingestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagerDutyWebhookEnvelope'
      responses:
        '200':
          description: |
            All messages processed. `updated` is the number of records patched
            (0 when every message was an ignored event type).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  updated: {type: integer, example: 1}
        '400':
          description: Missing or malformed payload (bad JSON, empty `messages`, or a missing `incident_key`).
        '404':
          description: No matching record found for the supplied `incident_key`.
        '500':
          description: Internal error (the DB state write failed).
        '503':
          $ref: '#/components/responses/IngestDisabledWebhook'

  /api/v1/webhook/slack:
    post:
      tags: [webhooks]
      summary: Slack interactive-message inbound webhook (ack from chat)
      description: |
        Receives Slack interactivity payloads fired when an operator presses an
        ack/close/re-open button under an alert message rendered by the Slack
        notifier's interactive mode. The body is
        `application/x-www-form-urlencoded` with a single `payload` field holding
        the Block Kit interaction JSON; `actions[0].value` is the action verb
        (`ack`/`close`/`open`) and `actions[0].block_id` is the record uid.

        The transition is applied through the same validity table the dashboard
        uses (an attributed comment is written so the activity feed records it);
        an illegal move is refused. The response is a Slack message-replacement
        JSON body (`replace_original: true`) that strips the buttons and shows
        the new state — Slack edits the message in place.

        **Authentication (fail closed):** every request is verified against the
        Slack `v0=` request signature —
        `X-Slack-Signature = "v0=" + HMAC-SHA256(signing_secret,
        "v0:" + X-Slack-Request-Timestamp + ":" + rawBody)` — compared in
        constant time, with timestamps more than 5 minutes from now rejected.
        While `slack_interactive.signing_secret` is unset the endpoint returns
        `401` for every request.
      parameters:
        - name: X-Slack-Signature
          in: header
          required: true
          schema: {type: string}
          description: 'Slack v0 request signature (`v0=<hex HMAC-SHA256>`).'
        - name: X-Slack-Request-Timestamp
          in: header
          required: true
          schema: {type: string}
          description: 'Unix-seconds request timestamp included in the signature base string.'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  description: 'URL-encoded Block Kit interaction JSON.'
      responses:
        '200':
          description: |
            Action processed (including a refused illegal transition — chat-client
            UX requires a 200). Body is the Slack message-replacement JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replace_original: {type: boolean, example: true}
                  text: {type: string, example: '✅ Acknowledged by alice'}
        '400':
          description: Missing or malformed `payload`.
        '401':
          description: Signature missing/invalid, timestamp stale, or signing secret unset (fail closed).

  /api/v1/webhook/telegram:
    post:
      tags: [webhooks]
      summary: Telegram callback-query inbound webhook (ack from chat)
      description: |
        Receives Telegram `callback_query` updates fired when an operator presses
        an ack/close/re-open inline-keyboard button under an alert message
        rendered by the Telegram notifier's interactive mode.
        `callback_query.data` is `"<action> <uid>"` (e.g. `ack rec-1`) and
        `callback_query.from` is the actor.

        The transition is applied through the same validity table the dashboard
        uses (an attributed comment is written); the message is edited in place
        via `editMessageText` and the callback is always answered to clear the
        client spinner. An illegal move is refused with a message edit and still
        returns 200.

        **Authentication (fail closed):** the `X-Telegram-Bot-Api-Secret-Token`
        header (set by Telegram when the webhook is registered with `setWebhook`)
        is constant-time compared against `telegram_interactive.secret_token`.
        While that secret is unset the endpoint returns `401` for every request.
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: {type: string}
          description: 'Per-webhook secret token Telegram echoes on every delivery.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'A Telegram Update object carrying a `callback_query`.'
      responses:
        '200':
          description: |
            Action processed (including a refused illegal transition). Body is
            `{"status":"ok"}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
        '400':
          description: Malformed Telegram update payload.
        '401':
          description: Secret token mismatch, or secret token unset (fail closed).

  /api/v1/heartbeat:
    get:
      tags: [crud]
      summary: List heartbeats with a computed health status
      description: |
        Heartbeats follow the generic CRUD surface (`/api/v1/{plugin}`) for
        create / replace / patch / delete / search, but the list and get-one
        responses additionally carry a computed, read-only `status` field
        (`ok` when the heartbeat was pinged within interval+grace, `overdue`
        when it has been silent longer — or has never been pinged, `slow` when
        within the window but the last ping latency exceeded `max_latency`). The
        field is never stored; it is projected at read time.

        The optional `status` query parameter filters the list to heartbeats
        whose computed status matches one of the supplied values
        (comma-separated, e.g. `?status=overdue` or `?status=ok,slow`).
        When the filter is present, `meta.count` and `meta.total` reflect the
        filtered slice.
      parameters:
        - {$ref: '#/components/parameters/QueryQ'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/OrderBy'}
        - {$ref: '#/components/parameters/Asc'}
        - name: status
          in: query
          required: false
          schema: {type: string}
          description: |
            Comma-separated computed-status filter (`ok`, `overdue`, `slow`).
            Absent returns every heartbeat.
      responses:
        '200':
          description: Paginated list; each item carries a computed `status`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Heartbeat'}
                  meta: {$ref: '#/components/schemas/ListMeta'}
        '400':
          description: Malformed query.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/heartbeat/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [crud]
      summary: Fetch a single heartbeat with its computed health status
      description: |
        Like the generic get-one, but the returned document additionally
        carries the read-only computed `status` field (`ok` / `overdue` /
        `slow`).
      responses:
        '200':
          description: Heartbeat document with a computed `status`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Heartbeat'}
        '404':
          description: Not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/webhook/heartbeat:
    post:
      tags: [webhooks]
      summary: Heartbeat ping (dead-man's-switch)
      description: |
        Keep a heartbeat alive: stamps the named heartbeat's `last_seen`
        to now. Public, but each ping must present the heartbeat's
        server-generated per-record token (a configured `ingest.token`
        applies on top). `GET` is also accepted.
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema: {type: string}
          description: The heartbeat name.
        - name: token
          in: query
          required: true
          schema: {type: string}
          description: The heartbeat's server-generated secret token.
        - name: sent_at
          in: query
          required: false
          schema: {type: integer}
          description: |
            Client send time in Unix milliseconds. When present the server
            computes and stores `last_latency = receive_time - sent_at`; an
            absent or unparseable value is silently ignored and the ping still
            succeeds.
      responses:
        '200':
          description: Heartbeat stamped.
        '401':
          description: Missing or invalid token.
        '404':
          description: No heartbeat with that name.

  /api/v1/config:
    get:
      tags: [schema]
      security: []
      summary: Org-wide web-console defaults
      description: |
        Public, read-only document of org-wide web-console defaults: the alert
        table columns, default filter, sort, auto-refresh interval, the severity
        rank ladder (+ its derived order), and light branding (logo / title /
        new-alert audio cue / clipboard template). The SPA fetches this once at
        boot and falls back to its built-in hardcodes when it is unavailable.

        The values are the server's code defaults overlaid by the runtime
        `console` settings section (edited from the admin Settings page via
        `PUT /api/v1/settings/console`). `severity_ranks` merges key-by-key onto
        the built-in ladder, so an operator places a custom severity by giving
        it a rank (e.g. `{"p1": 2}`) — it then sorts and colours like criticals.
        `severity_order` is always recomputed from the merged ranks.

        No auth token is required: the login screen needs branding before a
        token exists, and the blob is deliberately presentation-only (it does
        NOT expose `client_id` / tenant / provider details).
      responses:
        '200':
          description: Console configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ConsoleConfig'}

  /api/v1/permissions:
    get:
      tags: [schema]
      summary: List every permission string contributed by plugins
      description: |
        Returns the sorted, de-duplicated union of every permission string
        an authorizer can actually honour, drawn from three sources:

        - the canonical `rw_all` / `ro_all` wildcards;
        - a per-plugin `{rw,ro}_<name>` pair;
        - the `read` + `write` lists of every plugin's `authorization_policy`
          (on `route_defaults` and on each per-path `routes` override).

        Raw `metadata.provides` entries are deliberately excluded: `provides`
        advertises plugin capabilities (e.g. `notifier` / `receiver`) that no
        authorizer checks, so they are not assignable permissions. A functional
        custom permission such as `can_comment` still appears — via the
        `authorization_policy` that references it, not via `provides`.

        The `any` sentinel is excluded: it is an implicit grant the authorizer
        adds to every authenticated caller, never an assignable permission.
      responses:
        '200':
          description: Permission list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {type: string}

  /api/v1/schema/{plugin}:
    get:
      tags: [schema]
      summary: Fetch the JSON Schema attached to a DataModel plugin
      parameters:
        - {$ref: '#/components/parameters/PluginPath'}
      responses:
        '200':
          description: JSON Schema document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '404':
          description: Plugin has no schema.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/metadata:
    get:
      tags: [schema]
      summary: List every registered plugin's metadata
      description: |
        Returns the parsed `metadata.yaml` of every registered plugin
        (name / display_name / icon / action_form / widgets / etc.).
        The React frontend uses this to render plugin-defined typed
        forms — e.g. the Action sub-types (Mail, Webhook, Patlite) —
        instead of free-form JSON textareas.

        Plugins are sorted by name so the payload is deterministic.
      responses:
        '200':
          description: Plugin metadata list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Metadata'}

  /api/v1/metadata/{plugin}:
    get:
      tags: [schema]
      summary: Fetch a single plugin's metadata
      parameters:
        - {$ref: '#/components/parameters/PluginPath'}
      responses:
        '200':
          description: Plugin metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Metadata'}
        '404':
          description: Plugin not registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/stats:
    get:
      tags: [crud]
      summary: Dashboard aggregate statistics
      description: |
        Returns time-series counters, per-dimension totals, a live record
        snapshot and a weekday distribution for the requested time window.
        `from` and `to` are RFC3339 timestamps (or Unix epoch seconds);
        `bucket` is the series resolution in seconds (default 3600).
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string}
          description: Window start — RFC3339 or Unix epoch seconds.
        - name: to
          in: query
          required: true
          schema: {type: string}
          description: Window end — RFC3339 or Unix epoch seconds.
        - name: bucket
          in: query
          required: false
          schema: {type: integer, default: 3600}
          description: Series bucket size in seconds.
      responses:
        '200':
          description: Aggregated statistics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsResponse'}
        '400':
          description: Bad `from` or `to` parameter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}

  /api/v1/inputs:
    get:
      tags: [crud]
      summary: Per-source alert-input activity
      description: |
        For each alert `source` observed in stored records, the most recent
        alert epoch and a count, within a lookback window. Backs the admin
        Inputs page. `since` is a Unix epoch (seconds); when omitted the server
        uses a 30-day window. Requires the `ro_stats`/`rw_stats` permission.
        Returns 503 when the configured storage backend does not implement the
        source-activity aggregation capability.
      parameters:
        - name: since
          in: query
          required: false
          schema: {type: integer}
          description: Lower-bound Unix epoch (seconds). Defaults to now − 30 days.
      responses:
        '200':
          description: Per-source activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InputsResponse'}
        '400':
          description: Bad `since` parameter.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/{plugin}:
    parameters:
      - {$ref: '#/components/parameters/PluginPath'}
    get:
      tags: [crud]
      summary: List documents in a plugin's collection
      description: |
        The `q` query parameter is a base64url-encoded JSON condition.
        Default sort is by insertion order; pass `orderby` + `asc` to
        change it.
      parameters:
        - {$ref: '#/components/parameters/QueryQ'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/OrderBy'}
        - {$ref: '#/components/parameters/Asc'}
      responses:
        '200':
          description: Paginated list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '400':
          description: Malformed query.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
    post:
      tags: [crud]
      summary: Create one or many documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '422':
          description: Schema validation failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
    delete:
      tags: [crud]
      summary: Delete every document matching the query
      parameters:
        - {$ref: '#/components/parameters/QueryQ'}
      responses:
        '200':
          description: Deletion summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: {type: integer}

  /api/v1/{plugin}/search:
    post:
      tags: [crud]
      summary: Search with a JSON body (avoids URL-length limits)
      parameters:
        - {$ref: '#/components/parameters/PluginPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condition:
                  type: object
                  additionalProperties: true
                offset: {type: integer, default: 0}
                limit:  {type: integer, default: 20}
                orderby: {type: string}
                asc: {type: boolean, default: true}
      responses:
        '200':
          description: Paginated list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}

  /api/v1/{plugin}/{uid}:
    parameters:
      - {$ref: '#/components/parameters/PluginPath'}
      - name: uid
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [crud]
      summary: Fetch a single document by UID
      responses:
        '200':
          description: Document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrEnvelope'}
    put:
      tags: [crud]
      summary: Replace a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      tags: [crud]
      summary: Partial update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      tags: [crud]
      summary: Delete a single document
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusOK'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT. The Python 1.x `Authorization: JWT <token>` scheme
        is rejected. Obtain a token via `POST /api/v1/login/local`.

    ingestToken:
      type: http
      scheme: bearer
      description: |
        Per-tenant ingest token. Opaque random string stored in the tenant
        document (`ingest_token` field). Supply as `Authorization: Bearer
        <ingest_token>` or `?token=<ingest_token>`. When absent or unknown,
        the middleware falls back to the `default` tenant (D4). This scheme
        gates `/api/v1/alerts` and `/api/v1/webhook/*` in multi-tenant
        deployments; single-tenant deployments leave ingest open (existing
        behaviour preserved).

    apiKeyAuth:
      type: http
      scheme: bearer
      description: >
        A user API key, presented as `Authorization: Bearer snz_…`. Keys are
        minted at `/api/v1/user/me/apikeys`, carry a subset of the owner's
        permissions, and are bounded live by the owner's current permissions on
        every request.

    proxyHeader:
      type: apiKey
      in: header
      name: X-Forwarded-User
      description: >
        Trusted-header (auth-proxy) mode. Gated by `auth_proxy.enabled` and
        **disabled by default**. When enabled, an upstream reverse proxy
        (oauth2-proxy / Pomerium / mod_auth_openidc) that has already
        authenticated the user forwards the identity in the configured username
        header (default `X-Forwarded-User`) and an optional groups header
        (default `X-Forwarded-Groups`). Snooze JIT-provisions a `method=proxy`
        user, maps the groups to roles, and authenticates the request with no
        `Authorization` token. The header is only honored when the immediate TCP
        peer address (not any `X-Forwarded-For` / `X-Real-IP` header) is within
        `auth_proxy.trusted_proxies`, so the allowlist cannot be spoofed. Snooze
        does not validate the header value itself, so the proxy MUST strip any
        client-supplied copy. A failed gate (untrusted peer / absent header)
        falls through to the Bearer/`snz_` paths, never a hard reject.

  parameters:
    PluginPath:
      name: plugin
      in: path
      required: true
      description: |
        Plugin / collection name. The built-in set is enumerated in
        `internal/pluginimpl/all/all.go`.

        The `apikey` collection is the tenant-scoped admin surface over user
        API keys: reads require `ro_apikey` and writes require `rw_apikey`.
        `POST`/`PUT` are rejected here — mint keys via
        `POST /api/v1/user/me/apikeys`; admins may only `PATCH`
        (`name`/`expires_at`), revoke, or `DELETE`.

        The `audit` collection holds the audit trail. Each row's `object_type`
        field is the name of the affected collection for CRUD mutations
        (`rule`, `user`, …) or the sentinel value `auth` for authentication
        events (login / login_failed / refresh / logout), with the auth backend
        in `method` and the attempted identity in `username`.

        The `savedsearch` collection holds named alert-filter bookmarks
        (`name` + DSL `query`). It follows the generic CRUD surface but stamps
        `owner` from the JWT subject and scopes uniqueness to
        `(tenant_id, owner, name)`; a caller may only mutate their own
        bookmarks (admins may curate any). See the `SavedSearch` schema.

        The `notificationlog` collection holds the delivery history: one row
        per send attempt performed by the notification dispatcher. Rows are
        written by the server, never by clients — reads require
        `ro_notificationlog` and the write verbs exist only for tooling.
        Retention is governed by `housekeeping.cleanup_notificationlog`
        (default 30 days). See the `NotificationLogEntry` schema.

      schema:
        type: string
        enum:
          - action
          - aggregaterule
          - alertmanager
          - apikey
          - audit
          - azuremonitor
          - cloudwatch
          - comment
          - datadog
          - discord
          - environment
          - googlechat
          - grafana
          - heartbeat
          - influxdb2
          - kapacitor
          - kv
          - mail
          - newrelic
          - notification
          - notificationlog
          - ntfy
          - opsgenie
          - pagerduty
          - patlite
          - profile
          - prometheus
          - pushover
          - record
          - role
          - rule
          - savedsearch
          - script
          - sentry
          - servicenow
          - settings
          - slack
          - snooze
          - sns
          - stackdriver
          - stats
          - statuspage
          - telegram
          - twilio
          - user
          - webhook
          - widget
    QueryQ:
      name: q
      in: query
      required: false
      description: |
        Base64url-encoded JSON condition. Empty (or absent) selects
        every document. Use `POST /{plugin}/search` for queries that
        won't fit in a URL.
      schema:
        type: string
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 20
    OrderBy:
      name: orderby
      in: query
      required: false
      schema:
        type: string
    Asc:
      name: asc
      in: query
      required: false
      schema:
        type: boolean
        default: true

  responses:
    BadRequest:
      description: Malformed request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
    Forbidden:
      description: Authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
    Conflict:
      description: Conflict (e.g. attempt to delete a reserved resource).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
    ServiceUnavailable:
      description: The service or a required subsystem is not currently available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
    IngestDisabled:
      description: |
        Alert ingestion is currently disabled for this tenant by the runtime
        kill-switch (`ingest.allow = false`). Re-enable it from the Settings
        page (section `ingest`, key `allow`, value `true`) — no restart needed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
          example:
            error:
              code: unavailable
              message: alert ingestion is disabled
    IngestDisabledWebhook:
      description: |
        Alert ingestion is currently disabled for this tenant by the runtime
        kill-switch (`ingest.allow = false`). Re-enable it from the Settings
        page (section `ingest`, key `allow`, value `true`) — no restart needed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrEnvelope'
          example:
            error:
              code: ingest_disabled
              message: alert ingestion is disabled

  schemas:
    ConsoleConfig:
      type: object
      description: >
        Org-wide web-console defaults served read-only at GET /api/v1/config.
        Presentation-only: there is no per-label colour map — a custom severity
        is placed by rank (`severity_ranks`) and inherits a theme-aware
        `--severity-*` token client-side.
      properties:
        columns:
          type: array
          items: {type: string}
          description: Ordered alert-table column ids.
        default_filter:
          type: string
          description: Saved-search expression applied by default, or "".
        sort_by:
          type: string
          description: Default sort field; a "-" prefix means descending (e.g. "-date_epoch").
        refresh_interval:
          type: integer
          description: Alert-list auto-refresh interval, in seconds.
        severity_ranks:
          type: object
          additionalProperties: {type: integer}
          description: >
            Label → rank map (0 = most severe): the built-in ladder merged with
            operator additions. The single runtime source of truth for severity
            ordering and colour bucketing.
        severity_order:
          type: array
          items: {type: string}
          description: Labels most→least severe, derived from severity_ranks (never edited directly).
        logo:
          type: string
          description: 'Logo URL or data: URI; "" uses the bundled logo.'
        title:
          type: string
          description: Browser/app title; "" uses the default.
        audio:
          type: string
          description: New-alert audio cue URL; "" disables it.
        clipboard_template:
          type: string
          description: Copy-to-clipboard template; "" uses the default.
    SavedSearch:
      type: object
      description: >
        A named alert-filter bookmark: a human label paired with a raw Snooze
        condition-DSL string. `owner` and `tenant_id` are stamped server-side
        from the request's JWT and are read-only from the client's view.
      required: [name, query]
      properties:
        uid: {type: string}
        name:
          type: string
          minLength: 1
          description: Human label, e.g. "prod criticals unacked".
        query:
          type: string
          minLength: 1
          description: Raw Snooze condition-DSL string, e.g. "severity = critical".
        owner:
          type: string
          description: JWT subject that owns the bookmark (server-stamped).
        tenant_id:
          type: string
          description: Owning tenant slug (server-stamped).
    Group:
      type: object
      description: >
        A server-managed user cohort. `members[]` references users by
        `{username, method}` (the user collection's identity key). At login the
        RBAC resolver unions the names of every group the user belongs to into
        the group set, so a role whose `groups[]` lists this group's name is
        granted to every member — no IdP required. Keyed by `(tenant_id, name)`.
      required: [name]
      properties:
        uid: {type: string}
        name:
          type: string
          minLength: 1
          description: Group name, unique within the tenant, e.g. "sre".
        description:
          type: string
          description: Optional free-text label.
        members:
          type: array
          description: Users in this group, referenced by username + auth method.
          items:
            type: object
            properties:
              username: {type: string}
              method:
                type: string
                description: Auth method, e.g. "local" or "ldap".
        tenant_id:
          type: string
          description: Owning tenant slug (server-stamped).
    APIKey:
      type: object
      properties:
        uid: {type: string}
        owner: {type: string}
        owner_method: {type: string}
        name: {type: string}
        key_prefix:
          type: string
          description: First 12 chars of the key, for identification.
        permissions:
          type: array
          items: {type: string}
        groups:
          type: array
          items: {type: string}
        created_at: {type: number}
        expires_at: {type: number}
        revoked_at: {type: number}
        last_used_at:
          type: number
          description: >
            Unix epoch (seconds) of the last successful authentication with
            this key. Absent (or 0) if the key has never been used.
        use_count:
          type: number
          description: >
            Total number of times this key has authenticated a request
            (throttled: only incremented once per hour, so the value is a
            lower-bound estimate).
    APIKeyCreate:
      type: object
      required: [name]
      properties:
        name: {type: string}
        permissions:
          type: array
          items: {type: string}
          description: Must be a subset of the caller's own permissions.
        expires_at:
          type: string
          format: date-time
          description: RFC3339. Omit to default to the configured maximum lifetime.
    APIKeyCreated:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            key:
              type: string
              description: The raw key (snz_…). Returned ONCE, on creation only.

    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      example:
        status: ok

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        org:
          type: string
          description: |
            Optional tenant slug. Omitted or empty defaults to "default".
            Pass when the server hosts multiple organizations and the user
            wants to log in to a specific one (D10).

    LoginResponse:
      type: object
      required: [token, expires_at, method]
      properties:
        token:
          type: string
          description: "HS256 JWT access token. Send as `Authorization: Bearer <token>`."
        expires_at:
          type: string
          format: date-time
          description: "Absolute expiry of the access token."
        refresh_token:
          type: string
          description: |
            Opaque refresh token. Present on initial login and on every
            `/api/v1/login/refresh` response. Store securely on the client;
            POST it to `/api/v1/login/refresh` to mint a new access token
            and POST it to `/api/v1/login/logout` to revoke the session.
            Each refresh rotates the token — the previous value is revoked
            server-side and a new one is returned.
        refresh_expires_at:
          type: string
          format: date-time
          description: "Absolute expiry of the refresh token."
        method:
          type: string
          enum: [local, ldap, anonymous]
        tenant_id:
          type: string
          description: |
            Tenant slug the token is scoped to. Mirrors the `tenant_id` JWT
            claim. Empty on legacy tokens — treated as `default` by the server.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: "The refresh token returned by a prior login or refresh."

    Tenant:
      type: object
      required: [id, display_name, status]
      description: |
        One organization (tenant). id is the immutable URL/login-safe slug
        stamped as tenant_id on every scoped document. display_name is mutable.
      properties:
        id:
          type: string
          description: "Immutable slug, used as tenant_id on all scoped documents."
        display_name:
          type: string
          description: "Human-readable label; mutable."
        status:
          type: string
          enum: [active, suspended]
          description: "'suspended' blocks login + ingest but retains data."
        ingest_token:
          type: string
          description: "Per-tenant ingest token for unauthenticated ingress (D4)."
        listed:
          type: boolean
          default: true
          description: |
            Controls whether this tenant appears in the public login list
            returned by GET /api/v1/login. Default true. Set to false for
            SaaS tenants reached only via their per-tenant login_key link.
        login_key:
          type: string
          description: |
            Opaque, rotatable per-tenant discovery secret. Share
            /web/login?key=<login_key> to let users reach this tenant's login
            page without exposing the tenant list. Never included in the public
            login index. Rotate via POST /api/v1/tenant/{id}/rotate-login-key.
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    TenantMatchRule:
      type: object
      description: |
        One attribute→tenant routing rule in the global tenant_match registry
        (Plan 29). When an SSO/LDAP user authenticates without an explicit,
        non-default org, the login flow evaluates these rules in
        (priority ASC, uid ASC) order and routes the user to the first match's
        tenant_id.
      required: [match_type, match, tenant_id]
      properties:
        uid:
          type: string
          description: "Server-assigned id (response only)."
        match_type:
          type: string
          enum: [group, domain, login]
          description: |
            How `match` is compared: 'group' (any of the user's groups, case-
            insensitive), 'domain' (email ends with @match, case-insensitive),
            or 'login' (username, case-insensitive).
        match:
          type: string
          description: "The literal value compared (case-insensitive)."
        tenant_id:
          type: string
          description: "Target tenant slug; must name an existing tenant."
        priority:
          type: integer
          default: 0
          description: "Lower is evaluated first; ties broken by uid."

    Record:
      type: object
      description: |
        The canonical alert document moving through the Snooze
        pipeline. Mirrors `pkg/snoozetypes.Record`. Fields are
        permissive — plugins routinely inject extra keys that don't
        appear in this schema.
      properties:
        uid:         {type: string}
        host:        {type: string}
        source:      {type: string}
        source_ip:
          type: string
          description: |
            Resolved HTTP client IP stamped by the server at ingest. Present on
            all records that pass through `POST /api/v1/alerts` (honouring
            `X-Forwarded-For` / `X-Real-IP` from trusted proxies). Optional —
            caller-supplied values are preserved.
        process:     {type: string}
        severity:    {type: string}
        message:     {type: string}
        timestamp:   {type: string, format: date-time}
        date_epoch:  {type: integer, format: int64}
        ttl:         {type: integer, format: int64}
        environment: {type: string}
        tags:
          type: array
          items: {type: string}
        raw:
          type: object
          additionalProperties: true
        state:
          type: string
          # `esc` is a real, reachable value: the escalate-timeout sweep sets it
          # when an unacknowledged alert passes its deadline, and an operator's
          # `esc` comment sets it directly. It was missing from this enum, so a
          # client generated from this spec had a type that could not represent a
          # response the API actually returns.
          enum: ['', open, ack, esc, close, shelved]
        acked_by:
          type: string
          description: |
            Login of the operator who last acknowledged the alert. Stamped by
            the comment plugin on `ack` and cleared on `open`/`close` (kept
            through `esc`). Absent when the alert is not currently acknowledged.
        plugins:
          type: array
          items: {type: string}
        ack_until:
          type: integer
          format: int64
          description: |
            Server-controlled ack-expiry deadline (epoch seconds). Set when the
            record enters `ack`; the housekeeper's `escalate_timeout` sweep
            reverts the record to `open` once this passes. `0`/absent means no
            active ack expiry.
        escalate_at:
          type: integer
          format: int64
          description: |
            Auto-escalation deadline (epoch seconds). When
            `housekeeping.escalate_after` is set, an alert left unacknowledged
            past this is flipped to `esc` and re-notified. `0`/absent means
            escalation is not armed.
        shelve_until:
          type: integer
          format: int64
          description: |
            Timed-shelve auto-return deadline (epoch seconds). Stamped when a
            `shelve` comment is posted: `now + comment.duration` when the
            comment carries a positive `duration` (the window the operator
            picked), otherwise `now + housekeeping.shelve_timeout`. The
            housekeeper's `unshelve_timeout` sweep reverts the record from
            `shelved` to `open` once this passes. `0`/absent means either no
            timed shelve or the legacy permanent shelve (`ttl=-1`), which is
            never auto-unshelved.
        escalation_count:
          type: integer
          description: |
            How many times this alert has been re-escalated during its current
            lifecycle: `0`/absent on a first delivery, `1` on the first
            re-escalation, and so on. Stamped by every escalation producer (the
            `escalate_timeout` sweep, a `state->esc` comment, and the
            aggregaterule watchlist) and reset to `0` on close. Output plugins
            branch on it to update the ticket or chat thread they already
            created instead of opening a second one.
        escalated_at:
          type: integer
          format: int64
          description: |
            Epoch seconds of the current escalation. `0`/absent when the alert
            has never been escalated.
        escalation_reason:
          type: string
          enum: ['timeout', 'manual', 'watchlist']
          description: |
            Which producer escalated the alert: `timeout` (the escalate-timeout
            sweep), `manual` (an operator via the UI or a chat command), or
            `watchlist` (an aggregaterule watched-field change). Absent when
            never escalated.
        escalation_actor:
          type: string
          description: |
            Login of the operator who escalated, on a `manual` escalation only.
        rules:
          type: array
          items: {type: string}
          description: |
            Names of the rule-plugin rules this alert matched, in match order.
            Stamped by the `rule` plugin.
        aggregate:
          type: string
          description: |
            Name of the aggregate rule that grouped this alert (the
            `aggregaterule` plugin).
        snoozed:
          type: string
          description: |
            Name of the snooze rule that silenced this alert, when one matched.
            Present only on snoozed alerts; absent otherwise.
        notifications:
          type: array
          items: {type: string}
          description: |
            Names of the notification entries whose condition and time-constraints
            matched this alert. Stamped by the `notification` plugin.
        actions:
          type: array
          description: |
            Per-action outcome for every action a matched notification referenced.
            Misconfigured actions appear with status `error` and a reason; actions
            of a frequency-disabled notification appear as `skipped`.
          items:
            type: object
            properties:
              name:
                type: string
                description: Configured action entry name.
              notification:
                type: string
                description: The notification entry that triggered this action.
              status:
                type: string
                enum: [pending, sent, success, error, skipped]
              error:
                type: string
                description: Failure reason; present when status is `error`.
        previous_severity:
          type: string
          description: |
            Severity of the existing aggregate at the moment this occurrence
            arrived. Empty on the first occurrence. Stamped by the
            `aggregaterule` plugin; absent on records that did not hit an
            aggregate rule.
        trend_indication:
          type: string
          enum: [moreSevere, lessSevere, noChange, '']
          description: |
            Computed severity-change direction relative to `previous_severity`.
            `moreSevere` triggers an unconditional throttle bypass so
            escalations are never silently dropped. Stamped by the
            `aggregaterule` plugin; absent on first occurrences and on records
            that did not hit an aggregate rule.
      additionalProperties: true

    Comment:
      type: object
      description: |
        A comment attached to a record. Created through the generic CRUD
        surface (`POST /api/v1/{plugin}` with `plugin=comment`), which accepts
        any object; this schema documents the fields the server understands.

        A comment whose `type` is a state-changing action also transitions the
        linked record: `ack`/`close`/`open`/`esc` set `state` directly,
        `shelve` sets `state=shelved` plus a `shelve_until` deadline, and
        `unshelve` returns the record to `open` and clears the deadline.
      required: [record_uid]
      additionalProperties: true
      properties:
        uid:
          type: string
          readOnly: true
          description: Server-assigned identifier.
        record_uid:
          type: string
          minLength: 1
          description: uid of the record this comment is attached to.
        type:
          type: string
          enum: [comment, ack, close, open, esc, shelve, unshelve]
          description: |
            `comment` is a free-form note; every other value additionally
            drives the linked record's state transition.
        message:
          type: string
          description: Free-form note. Must not be empty when present.
        duration:
          type: integer
          format: int64
          minimum: 0
          description: |
            Shelve window in seconds. Only meaningful on a `type: "shelve"`
            comment, where the server stamps
            `record.shelve_until = now + duration`. Absent or `0` falls back to
            the configured `housekeeping.shelve_timeout`. Negative values are
            rejected with a 422; there is no upper bound.
        user:
          type: string
          readOnly: true
          description: |
            Server-stamped from the authenticated subject; any client-supplied
            value is overwritten. Absent on auto-comments written by the
            housekeeper or the aggregaterule plugin, which is how the activity
            feed tells a human action from a system event.
        method:
          type: string
          description: |
            Auth method of the caller, stamped from the claims when the caller
            did not set one — the chat-ops bridges set it themselves
            (`teams`/`jira`/`mcp`) to record the originating channel.
        date:
          type: string
          description: Human-readable creation timestamp.
        date_epoch:
          type: integer
          format: int64
          description: Creation time in epoch seconds.

    ListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: '#/components/schemas/ListMeta'

    ListMeta:
      type: object
      required: [count, limit, offset, total]
      properties:
        count:  {type: integer}
        limit:  {type: integer}
        offset: {type: integer}
        total:  {type: integer}

    Heartbeat:
      type: object
      description: |
        A dead-man's-switch heartbeat record. Created/edited via the generic
        CRUD surface; the list and get-one responses additionally carry the
        read-only computed `status` field.
      required: [name, interval]
      additionalProperties: true
      properties:
        name:
          type: string
          minLength: 1
          description: Unique heartbeat name; pinged via ?name=<name>&token=<token>.
        token:
          type: string
          readOnly: true
          description: Server-generated ping secret; supplied as ?token= on every ping.
        interval:
          type: integer
          minimum: 1
          description: Expected ping period in seconds.
        grace:
          type: integer
          minimum: 0
          description: Extra slack in seconds before a miss fires (optional).
        max_latency:
          type: integer
          minimum: 0
          description: |
            Maximum acceptable ping latency in milliseconds. 0 or absent disables
            latency tracking. When a ping carries ?sent_at= and the computed
            latency exceeds this while the heartbeat is still within its window, a
            lower-severity `slow` alert fires.
        last_latency:
          type: integer
          readOnly: true
          description: |
            Latency of the most recent ping in milliseconds (receive_time -
            sent_at). Set by the ping endpoint when ?sent_at= is supplied; absent
            otherwise.
        last_seen:
          type: string
          description: Last ping time (RFC3339 or epoch seconds); set by the ping endpoint.
        environment: {type: string}
        host:
          type: string
          description: Alert host; defaults to the heartbeat name.
        severity:
          type: string
          description: Severity of the miss alert.
        enabled:
          type: boolean
          description: Disabled heartbeats are not scanned.
        message:
          type: string
          description: Optional custom miss-alert message.
        status:
          type: string
          enum: [ok, overdue, slow]
          readOnly: true
          description: |
            Computed health status. `ok` when pinged within interval+grace,
            `overdue` when silent longer (or never pinged), `slow` when within
            the window but the last ping latency exceeded `max_latency`. Never
            stored; projected at read time on list/get responses only.

    Snooze:
      type: object
      description: |
        A snooze filter: a condition + time-constraint window that suppresses
        matching alerts. Created/edited via the generic CRUD surface; the list
        and get-one responses additionally carry the read-only computed
        `window_status` and `remaining_seconds` fields, projected at read time
        from the whole `time_constraints` group.
      required: [name]
      additionalProperties: true
      properties:
        name:
          type: string
          minLength: 1
          description: Unique snooze filter name.
        comment:
          type: string
          description: Optional human description.
        enabled:
          type: boolean
          description: Disabled snoozes never match.
        condition:
          description: Snooze condition (object or legacy-list DSL form).
        time_constraints:
          type: object
          description: |
            Active time windows (absolute datetime ranges, daily-time windows,
            weekdays). The snooze only matches when the current moment is within
            every populated family. An optional IANA `tz` (e.g. "Europe/Paris")
            names the zone the RECURRING families (daily-time + weekdays) are
            interpreted in — so they track that zone's wall clock (DST included)
            instead of UTC; absolute datetime bounds carry their own offset and
            are unaffected. Absent `tz` preserves the UTC interpretation. When
            `tz` is set it must be a real IANA name (not "Local"), and every
            absolute datetime bound must carry an explicit offset — a bare,
            zone-less datetime is rejected as ambiguous.
        discard:
          type: boolean
          description: |
            When true, matching alerts are dropped from the pipeline; otherwise
            they are tagged `snoozed:<name>` and allowed through.
        hits:
          type: integer
          readOnly: true
          description: Server-maintained match counter.
        name_create:
          type: string
          readOnly: true
          description: The user that created the snooze (server-stamped).
        window_status:
          type: string
          enum: [active, pending, expired, always_on]
          readOnly: true
          description: >
            Derived lifecycle status computed at read time from the whole
            time_constraints group (all populated families AND'd, resolved in
            time_constraints.tz when set) — the same predicate the pipeline
            suppresses on. "active" means the rule matches now; "always_on"
            means no constraint is set in any family (the rule fires
            indefinitely); a rule wholly past its datetime window is "expired";
            anything else (a future window, or a recurring window between slots)
            is "pending". Omitted entirely when time_constraints cannot be
            parsed (the pipeline drops such a rule too). Never stored; projected
            on list/get responses only.
        remaining_seconds:
          type: integer
          format: int64
          readOnly: true
          description: >
            Seconds until the active window closes. 0 when always_on, pending,
            or no upper bound. Never stored; projected at read time.

    Notification:
      type: object
      description: |
        A notification entry: the routing object that decides **when** an alert
        is delivered. It pairs a condition (and an optional time-constraint
        window) with a list of `action` names that decide **how** the delivery
        happens. Stored in the `notification` collection and served by the
        generic CRUD surface.

        Each actual send is recorded as a row in the `notificationlog`
        collection — see the `NotificationLogEntry` schema.
      required: [name]
      additionalProperties: true
      properties:
        uid:
          type: string
          readOnly: true
          description: Server-assigned identifier.
        name:
          type: string
          minLength: 1
          description: Unique notification name within the tenant.
        comment:
          type: string
          description: Optional human description.
        enabled:
          type: boolean
          description: Disabled notifications never match, so nothing is sent.
        condition:
          description: Match condition (object or legacy-list DSL form).
        actions:
          type: array
          description: Names of the `action` entries fired on a match.
          items: {type: string}
        time_constraints:
          type: object
          description: >
            Active time windows (absolute datetime ranges, daily-time windows,
            weekdays). The notification only fires when the current moment is
            within every populated family.
        frequency:
          type: object
          description: >
            Throttle parameters forwarded to the notifier. Only `total` is
            honoured today (`total: 0` skips the send entirely); `delay` and
            `every` are parsed but not yet implemented.
          properties:
            total: {type: integer}
            delay: {type: integer}
            every: {type: integer}
        hits:
          type: integer
          readOnly: true
          description: >
            Number of successful deliveries fired by this notification.
            Maintained by the dispatcher via a read-modify-write on successful
            deliveries; client-supplied values are stripped on write.
        last_sent:
          type: number
          readOnly: true
          description: >
            Unix timestamp (seconds) of the most recent successful delivery.
            Maintained by the dispatcher via a read-modify-write on successful
            deliveries; client-supplied values are stripped on write. Absent
            until the first successful send.
        tenant_id:
          type: string
          readOnly: true
          description: Owning tenant slug (server-stamped).

    NotificationLogEntry:
      type: object
      description: |
        One **delivery**: a single send attempt performed by one action, on
        behalf of one or more notifications, covering one or more alerts.

        Rows live in the tenant-scoped `notificationlog` collection and are
        written by the notification dispatcher — they are **read-only in
        practice**. The CRUD write verbs exist only for tooling and tests; no
        UI path creates or edits a row.

        Granularity: an unbatched send produces one row per (alert × action).
        A batching notifier (webhook / mail / script with `batch: true`)
        produces exactly one row per flush, listing every member alert in
        `alerts[]`.

        The `alerts[]` snapshot is captured at send time so the row still
        renders after the alert record's own TTL (default 2 days) has expired.
        The flat `alert_uids` / `alert_hashes` / `notification_uids` /
        `notification_names` arrays exist so the condition DSL can filter rows
        with `field CONTAINS "value"` (object-path filtering into `alerts[]`
        is not expressible).

        Retention is governed by `housekeeping.cleanup_notificationlog`
        (default `720h` = 30 days); writing rows at all is gated by
        `notification.delivery_log` (default `true`).
      additionalProperties: true
      properties:
        uid:
          type: string
          readOnly: true
          description: Server-assigned identifier.
        date_epoch:
          type: number
          description: >
            Send COMPLETION time, Unix seconds. This is the sort key (newest
            first) and the retention key the housekeeper prunes on.
        queued_epoch:
          type: number
          description: >
            Unix seconds at which the dispatch was decided (the alert matched
            during pipeline Process). For a batched row this is the moment the
            FIRST member was queued, so `date_epoch - queued_epoch` is the
            batch's dwell time.
        duration_ms:
          type: integer
          description: Wall-clock duration of the send call, in milliseconds.
        status:
          type: string
          enum: [success, error]
          description: >
            Outcome of the attempt. `error` covers both a failed send and a
            misconfigured action (action not found, no notifier selected,
            notifier not registered). Frequency-skipped sends are NOT logged.
        error:
          type: string
          description: Failure text. Present (non-empty) only when `status` is `error`.
        action:
          type: string
          description: Name of the `action` entry that performed the send.
        notifier:
          type: string
          description: >
            Registry key of the notifier plugin used (`mail`, `webhook`,
            `script`, `slack`, …) — i.e. the action's `selected` value.
        batch:
          type: boolean
          description: >
            True when the row describes a batched flush covering several
            alerts, false for a single unbatched send.
        batch_reason:
          type: string
          enum: ['', size, timer, shutdown]
          description: >
            Why the batch flushed: `size` (reached `batch_maxsize`), `timer`
            (reached `batch_timer`), or `shutdown` (the server drained pending
            buckets on graceful shutdown). `""` means unbatched — the field is
            elided from the stored row entirely, so treat absent and empty as
            the same thing.
        notification_uids:
          type: array
          description: >
            `uid`s of the notifications this delivery was made for. Usually one;
            a batch may carry several when they share the same action. Flat so
            `notification_uids CONTAINS "<uid>"` works in the DSL. May be
            shorter than `notification_names` when a uid could not be resolved.
          items: {type: string}
        notification_names:
          type: array
          description: Names of the notifications this delivery was made for.
          items: {type: string}
        alert_count:
          type: integer
          description: >
            Number of alerts covered by this delivery — the length of
            `alerts[]` AFTER de-duplication (members are deduped on uid,
            falling back to hash, so a batch that queued the same alert twice
            counts it once). 1 for an unbatched row.
        alert_uids:
          type: array
          description: >
            `uid`s of the covered alerts. May be SHORTER than `alerts[]`: a
            first-occurrence alert has no uid until its record lands, and
            unresolved entries are omitted rather than stored empty. Flat so
            `alert_uids CONTAINS "<uid>"` works in the DSL.
          items: {type: string}
        alert_hashes:
          type: array
          description: >
            Dedup hashes of the covered alerts. Always populated (a hash exists
            before the record is written), so this is the reliable fallback key
            when a uid is missing.
          items: {type: string}
        alerts:
          type: array
          description: >
            Per-alert snapshot captured at send time, one entry per covered
            alert. Kept verbatim so the delivery still renders after the alert
            record itself has expired.
          items:
            type: object
            additionalProperties: true
            properties:
              uid:
                type: string
                description: >
                  Alert record uid. Absent when the alert's uid could not be
                  resolved — a first-occurrence alert has no uid until its
                  record lands, and the key is omitted rather than stored
                  empty. `hash` is always present and is what the UI links on
                  in that case.
              hash:
                type: string
                description: Alert dedup hash. Always present.
              host:
                type: string
                description: Alert `host` field at send time.
              severity:
                type: string
                description: Alert `severity` field at send time.
              message:
                type: string
                description: Alert `message` at send time, truncated to 512 characters.
              state:
                type: string
                description: Alert lifecycle state at send time (open, ack, esc, …).
              notification:
                type: string
                description: >
                  Name of the notification that matched this particular alert.
                  Distinguishes members of a mixed batch.
        escalation_count:
          type: integer
          description: >
            Re-escalation depth of this delivery — the maximum over all covered
            alerts. 0 for a first delivery.
        escalation_reason:
          type: string
          description: >
            Why the alert re-escalated, when it did: `timeout`, `manual` or
            `watchlist`. Empty string on a first delivery.
        ref:
          type: object
          additionalProperties: true
          description: >
            The external handle the notifier created for this delivery, when it
            creates one — e.g. `{"issue_key": "OPS-123"}` for Jira,
            `{"thread_ts": "…"}` for Slack, `{"message_id": …}` for Telegram.
            Free-form: keys vary per notifier. An optional `url` key carries a
            directly openable deep link when one is derivable, which the UI
            renders as an "open in <system>" link. Absent when the notifier
            returns no handle.
          properties:
            url:
              type: string
              description: Optional deep link to the external object.
        tenant_id:
          type: string
          readOnly: true
          description: Owning tenant slug (server-stamped).

    PagerDutyWebhookEnvelope:
      type: object
      description: |
        PagerDuty webhook v2 payload. Each entry in `messages` carries an event
        `type` and a `data.incident` object whose `incident_key` is the
        dedup-key Snooze set when it triggered the incident.
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, data]
            properties:
              type:
                type: string
                description: |
                  PagerDuty event type, e.g. `incident.acknowledge`,
                  `incident.resolve`, `incident.trigger`,
                  `incident.unacknowledge`, `incident.escalate`,
                  `incident.assign`, `incident.delegate`.
                example: incident.acknowledge
              data:
                type: object
                properties:
                  incident:
                    type: object
                    required: [incident_key]
                    properties:
                      incident_key:
                        type: string
                        description: Dedup key Snooze set (== record.hash, fallback record.uid).
                        example: abc123
                      incident_number: {type: integer}
                      html_url: {type: string}

    ErrEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrBody'

    ErrBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - validation_error
            - unavailable
            - internal
        message: {type: string}
        details:
          type: object
          additionalProperties: true
        request_id: {type: string}

    Metadata:
      type: object
      description: |
        Parsed `metadata.yaml` for a registered plugin. Mirrors
        `plugins.Metadata` in Go. Field keys are snake_case (JSON tags
        align with the YAML keys so the frontend reads the document
        verbatim).
      required: [name, plugin_name]
      properties:
        plugin_name:
          type: string
          description: |
            Registry key (machine-readable identifier; matches `Plugin.Name()`
            on the server). Injected by the metadata HTTP handler — stable
            across plugins regardless of what their YAML `name:` field carries.
            Use this (not `name`) to match a notification action's `action.selected`.
        name: {type: string, description: "Display label taken from the plugin's YAML `name:` field (e.g. \"Send email\", \"Run a script\"). Use `plugin_name` for machine matching."}
        display_name: {type: string, description: "Human-readable label (YAML `desc`)."}
        icon: {type: string, description: "Icon glyph name."}
        default_sorting: {type: string}
        default_ordering: {type: string}
        auto_reload: {type: boolean}
        widgets:
          type: object
          additionalProperties: true
          description: "Free-form per-plugin widget descriptors."
        action_form:
          type: object
          description: "Per-field form descriptor keyed by field name."
          additionalProperties: {$ref: '#/components/schemas/FormField'}
        setting_form:
          type: object
          description: |
            Typed catalogue of runtime settings (settings plugin only). Same
            FormField shape as `action_form`; the optional `group` field on
            each entry lets the frontend render the picker grouped by section.
          additionalProperties: {$ref: '#/components/schemas/FormField'}
        provides:
          type: array
          items: {type: string}
          description: "Permission strings the plugin contributes."
        routes:
          type: object
          description: "Per-route overrides, keyed by route path."
          additionalProperties:
            type: object
            properties:
              class_name: {type: string}
              check_permissions: {type: boolean}
              primary_key:
                type: array
                items: {type: string}
              duplicate_policy: {type: string}
              authentication: {type: boolean}
        options:
          type: object
          additionalProperties: true
        search_fields:
          type: array
          items: {type: string}
        audit: {type: boolean}
        force_order: {type: integer}
        tree: {type: boolean}
      additionalProperties: true

    FormField:
      type: object
      description: |
        One field of a plugin's `action_form`. The React frontend renders
        a typed input based on `component`; `options` populates choice
        widgets (Selector, Radio).
      properties:
        display_name: {type: string}
        component:
          type: string
          description: "Widget kind (e.g. String, Number, Text, Selector, Radio, Password)."
        description: {type: string}
        required: {type: boolean}
        default_value: {}
        group:
          type: string
          description: |
            Logical section the field belongs to (e.g. "general" or
            "notification" for settings). Used by the frontend to render
            grouped pickers; ignored by the server.
        invert:
          type: boolean
          description: |
            For a Switch field: flips the displayed checked state and the
            value written back on toggle, so a positively-phrased label
            (e.g. "Maintenance mode") can be backed by a
            negatively-phrased stored value (e.g. `ingest.allow`).
            Ignored by the server.
        options:
          type: array
          items:
            type: object
            properties:
              text: {type: string}
              value: {}
      additionalProperties: true

    StatsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/StatsData'
        meta:
          $ref: '#/components/schemas/StatsMeta'

    InputActivity:
      type: object
      required: [source, last_epoch, count]
      properties:
        source: {type: string, description: "Record source string (lowercased join key on the client)."}
        last_epoch: {type: integer, description: "Most recent alert epoch (seconds) for this source in the window."}
        count: {type: integer, description: "Number of alerts from this source in the window."}

    InputsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/InputActivity'}

    StatsData:
      type: object
      required: [series, totals, snapshot, weekday]
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/SeriesBucket'
        totals:
          $ref: '#/components/schemas/StatsTotals'
        snapshot:
          $ref: '#/components/schemas/StatsSnapshot'
        weekday:
          type: object
          description: "Alert counts keyed by weekday (\"0\" = Sunday … \"6\" = Saturday)."
          additionalProperties: {type: integer}

    SeriesBucket:
      type: object
      required: [t, counts]
      properties:
        t:
          type: string
          format: date-time
          description: "Bucket start timestamp (RFC3339)."
        counts:
          type: object
          description: "Per-series alert counts for this bucket."
          additionalProperties: {type: integer}

    StatsTotals:
      type: object
      required:
        - by_severity
        - by_environment
        - by_host
        - by_action_success
        - by_action_failure
        - by_throttled
        - by_snoozed
        - by_notification
      properties:
        by_severity:
          type: object
          additionalProperties: {type: integer}
        by_environment:
          type: object
          additionalProperties: {type: integer}
        by_host:
          type: object
          description: "Top-10 hosts by alert count."
          additionalProperties: {type: integer}
        by_action_success:
          type: object
          additionalProperties: {type: integer}
        by_action_failure:
          type: object
          additionalProperties: {type: integer}
        by_throttled:
          type: object
          additionalProperties: {type: integer}
        by_snoozed:
          type: object
          additionalProperties: {type: integer}
        by_notification:
          type: object
          additionalProperties: {type: integer}

    StatsSnapshot:
      type: object
      required: [by_state, total_hits, open, ack, closed]
      properties:
        by_state:
          type: object
          description: "Live alert counts keyed by state string, across all alerts (not windowed)."
          additionalProperties: {type: integer}
        total_hits:
          type: integer
          description: "Total alert hits in the requested window."
        open:
          type: integer
          description: "Live count of records currently in the open state (not windowed)."
        ack:
          type: integer
          description: "Live count of records currently in the ack state (not windowed)."
        closed:
          type: integer
          description: "Live count of records currently in the close state (not windowed)."

    StatsMeta:
      type: object
      required: [from, to, bucket, counters]
      properties:
        from:
          type: string
          format: date-time
          description: "Actual window start used by the server (RFC3339)."
        to:
          type: string
          format: date-time
          description: "Actual window end used by the server (RFC3339)."
        bucket:
          type: integer
          description: "Series bucket size in seconds."
        counters:
          $ref: '#/components/schemas/StatsCounters'

    StatsCounters:
      type: object
      required: [enabled, present]
      description: |
        Provenance for the counter-backed half of the response (series,
        totals, weekday). Lets a client distinguish "metrics are off",
        "no counter has ever been written" and "quiet window".
      properties:
        enabled:
          type: boolean
          description: "Mirrors general.metrics_enabled; false means counters are never written."
        present:
          type: boolean
          description: "True when at least one counter document exists, in this window or any other."

    AdminCredential:
      type: object
      required: [username, password, method, created]
      description: |
        Provisioned local-admin credential. The `password` is shown exactly
        once (it is not stored in plaintext); save it immediately.
      properties:
        username:
          type: string
          description: "Login username of the provisioned admin."
        password:
          type: string
          description: "Plaintext password shown once. Store it securely."
        method:
          type: string
          description: "Authentication method used (always 'local' for provisioned admins)."
        created:
          type: boolean
          description: "True if the user was newly created; false if the password was reset on an existing user."

    TenantCreateResponse:
      type: object
      required: [added]
      description: "Response body for POST /api/v1/tenant."
      properties:
        added:
          type: array
          items: {type: string}
          description: "List of created tenant id(s)."
        admin:
          $ref: '#/components/schemas/AdminCredential'
          description: "Present only when a first admin was provisioned (create_admin was not false)."

    TenantCreate:
      type: object
      required: [id, display_name]
      description: "Request body for POST /api/v1/tenant."
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,62}[a-z0-9]$'
          description: "Immutable slug. Must be unique. Reserved value `default` is rejected."
        display_name:
          type: string
          description: "Human-readable label."
        status:
          type: string
          enum: [active, suspended]
          default: active
        listed:
          type: boolean
          default: true
          description: |
            Whether the tenant appears in the public login page's tenant list.
            Set false for SaaS-style deployments where tenants reach their login
            page via their opaque login link instead.
        ingest_token:
          type: string
          description: |
            Per-tenant ingest token. If omitted the server generates a random
            24-byte hex token and returns it in the response body. Store it:
            this is the only time the plaintext is returned.
        create_admin:
          type: boolean
          description: "Provision a first local admin (default true). Set false for LDAP/SSO-only tenants."
        admin_username:
          type: string
          description: "Username for the first admin (default \"admin\")."

    TenantUpdate:
      type: object
      description: "Request body for PATCH /api/v1/tenant/{id}. All fields optional."
      properties:
        display_name:
          type: string
          description: "New human-readable label."
        status:
          type: string
          enum: [active, suspended]
          description: "Change the lifecycle state."
        ingest_token:
          type: string
          description: |
            Rotate the ingest token. Supply a new value or an empty string to
            disable unauthenticated ingestion for this tenant. The server does
            NOT auto-generate a new token on update — supply one explicitly.
        listed:
          type: boolean
          description: |
            Toggle public visibility in the login tenant list. Set to false
            to hide the tenant from the public login dropdown; share the
            per-tenant login_key link instead.
