---
name: 'Send a Google Chat message'
desc: 'Post an alert to a Google Chat space via Incoming Webhook'
icon: 'google'
category: 'chat'
doc_url: 'https://snoozeweb.github.io/snooze/general/integrations/googlechat'
provides:
    - notifier
daemon:
    name: snooze-googlechat
    blurb: 'Bidirectional Google Chat bot for interactive alert handling (in development).'
    doc_url: 'https://snoozeweb.github.io/snooze/general/integrations/googlechat#advanced-bidirectional-daemon'
# Field order: webhook first, then content knobs, then threading, then timeout.
action_form:
    webhook_url:
        display_name: Webhook URL
        component: String
        description: 'Google Chat Incoming Webhook URL (https://chat.googleapis.com/v1/spaces/.../messages?key=...&token=...)'
        required: true
    message:
        display_name: Message
        component: Text
        default_value: '*{{ .Severity }}* on {{ .Host }}: {{ .Message }}'
        description: 'Message text (Go text/template over the record fields: .UID .Host .Source .Process .Severity .Message .State .Timestamp .Tags)'
    use_card:
        display_name: Use Card
        component: Switch
        default_value: true
        description: 'Send a cardsV2 card instead of a plain text message'
    thread_key:
        display_name: Thread Key
        component: String
        default_value: '{{ .Hash }}'
        description: 'Groups messages into one Chat thread (Go text/template). Defaults to the alert hash, so every occurrence and re-escalation of an alert lands in the same thread and a re-escalation posts a short reply instead of a repeated card. Clear it to make every message start its own conversation.'
    timeout:
        display_name: Timeout
        component: String
        default_value: '10s'
        description: 'Request timeout as a Go duration (default 10s)'
