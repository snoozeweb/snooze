---
name: 'Create a JIRA issue'
desc: 'Open a JIRA Cloud issue via the REST API v3 (fire-and-forget create)'
icon: 'jira'
category: 'ticketing'
doc_url: 'https://snoozeweb.github.io/snooze/general/integrations/jira'
provides:
    - notifier
daemon:
    name: snooze-jira
    blurb: 'Auto-close Snooze records when the JIRA ticket is resolved. Re-escalation already comments on the existing ticket in the built-in mode; the daemon adds the JIRA-to-Snooze direction.'
    doc_url: 'https://snoozeweb.github.io/snooze/general/integrations/jira#advanced-bidirectional-daemon'
action_form:
    jira_url:
        display_name: JIRA URL
        component: String
        description: 'JIRA Cloud base URL (e.g. https://mycompany.atlassian.net)'
        required: true
    email:
        display_name: Email
        component: String
        description: 'Atlassian account email for HTTP Basic auth'
        required: true
    api_token:
        display_name: API Token
        component: Password
        description: 'Atlassian Cloud API token paired with the email'
        required: true
    project_key:
        display_name: Project Key
        component: String
        description: 'Target JIRA project key (e.g. OPS)'
        required: true
    issue_type:
        display_name: Issue Type
        component: String
        default_value: 'Task'
        description: 'JIRA issue type name (default: Task)'
    priority:
        display_name: Priority (override)
        component: String
        description: 'Optional. Pins the priority for every issue this action creates, given as a priority id ("3") or a name exactly as your JIRA site shows it ("Moyen", "High"). Leave blank — recommended — and the severity is mapped onto the project''s live priority scheme automatically, in any language. A value that names nothing in that scheme is ignored rather than failing the create.'
    summary:
        display_name: Summary (ticket title)
        component: String
        default_value: '[{{ .Severity }}] {{ .Host }} - {{ .Message }}'
        description: 'Overrides the created ticket title. Plain text, or a Go text/template over the record fields (e.g. "{{ .Host }} down - {{ .Message }}"). Clamped to 255 characters; falls back to the default title when the template is invalid.'
    description:
        display_name: Description
        component: Text
        description: 'Issue description (Go text/template over the record fields). When blank, a structured default is generated.'
    labels:
        display_name: Labels
        component: String
        default_value: 'snooze'
        description: 'Comma-separated labels applied to the new issue.'
    on_escalation:
        display_name: On re-escalation
        component: Selector
        default_value: 'reopen'
        options:
            - {text: 'Comment + reopen the ticket (recommended)', value: reopen}
            - {text: 'Comment only',                              value: comment}
            - {text: 'Open a second, linked ticket',              value: new}
            - {text: 'Do nothing in JIRA',                        value: skip}
        description: 'What to do when an alert that already has a ticket escalates again. "reopen" (recommended) comments on the existing ticket and transitions it back out of a Done status; "comment" only comments; "new" opens a second ticket linked to the first; "skip" leaves JIRA untouched. Never creates a duplicate ticket except under "new".'
    reopen_status:
        display_name: Reopen status
        component: String
        default_value: 'To Do'
        description: 'Status a resolved ticket is transitioned back to on re-escalation, used only when On re-escalation is "reopen". Must be a status the ticket''s workflow actually offers; when it does not, the comment is still posted and the transition is skipped.'
    escalation_comment:
        display_name: Escalation comment (extra)
        component: Text
        description: 'Optional text appended to the re-escalation comment, as plain text or a Go text/template over the record fields. The comment already carries the escalation number, reason, host, severity and message.'
    link_type:
        display_name: Link type
        component: String
        default_value: 'Relates'
        description: 'Issue-link type used to connect the follow-up ticket to the original, used only when On re-escalation is "new".'
    on_close:
        display_name: On alert close
        component: Selector
        default_value: 'comment'
        options:
            - {text: 'Comment on the ticket (recommended)', value: comment}
            - {text: 'Do nothing in JIRA',                   value: skip}
        description: 'What to do on the ticket when the alert closes. "comment" posts who closed it (or that the source recovered) and the latest "Resolved:" note from the alert timeline, then applies Close transition when one is set. A close that came from JIRA itself (the snooze-jira daemon) is never echoed back.'
    close_transition:
        display_name: Close transition
        component: String
        description: 'Optional. Status (or transition name, or numeric transition id) the ticket is moved to when the alert closes, e.g. "Done". Blank leaves the ticket status alone. Skipped when the ticket is already resolved; when the workflow offers no such transition the comment is still posted and the failure is noted on the alert timeline.'
    timeout:
        display_name: Timeout
        component: String
        default_value: '10s'
        description: 'Request timeout as a Go duration (default 10s)'
