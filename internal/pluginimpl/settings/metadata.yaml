---
name: 'Settings'
desc: 'An endpoint to store config files'
route_defaults:
    class_name: ~
    check_permissions: true
routes:
    '/settings/{section}':
        desc: ''
        class_name: SettingsRoute

# setting_form is the typed catalogue of runtime settings the server actually
# reads. The runtime ``settings`` collection accepts arbitrary key/value pairs,
# but only the keys listed here have a documented type and default; the
# frontend uses this catalogue to render a typed input per setting instead of
# a raw JSON textarea.
#
# The `group:` field on each entry lets the React frontend render the picker
# grouped by section (general vs notification). Description text is the
# canonical copy from docs/content/configuration/{general,notifications}.md.
setting_form:
    ingest.allow:
        display_name: 'Maintenance mode'
        component: 'Switch'
        description: 'When enabled, every POST /api/v1/alerts and every webhook receiver returns 503 immediately — useful during an alert flood or a maintenance window. Takes effect immediately, no restart needed.'
        default_value: true
        invert: true
        group: 'general'
    default_auth_backend:
        display_name: 'Default authentication backend'
        component: 'Selector'
        description: 'Backend that will be first in the list of displayed authentication backends.'
        default_value: 'local'
        options:
            - { text: 'Local', value: 'local' }
            - { text: 'LDAP', value: 'ldap' }
            - { text: 'Anonymous', value: 'anonymous' }
        group: 'general'
    local_users_enabled:
        display_name: 'Local users enabled'
        component: 'Switch'
        description: 'Enable the creation of local users in snooze. Can be disabled when another reliable authentication backend is used and the admin wants to make auditing easier.'
        default_value: true
        group: 'general'
    metrics_enabled:
        display_name: 'Metrics enabled'
        component: 'Switch'
        description: 'Enable Prometheus metrics.'
        default_value: true
        group: 'general'
    anonymous_enabled:
        display_name: 'Anonymous enabled'
        component: 'Switch'
        description: 'Enable anonymous user login. When a user logs in as anonymous, they will be given user permissions.'
        default_value: false
        group: 'general'
    ok_severities:
        display_name: 'OK severities'
        component: 'Arguments'
        description: 'List of severities that will automatically close the aggregate upon entering the system. Only applies to records arriving without an explicit state — webhook integrations that already report a close state themselves are unaffected. Mainly for icinga/grafana that close the alert when the status becomes green again.'
        default_value: ['ok', 'success']
        placeholder: 'severity name'
        group: 'general'
    snooze_bypass_severities:
        display_name: 'Snooze bypass severities'
        component: 'Arguments'
        description: 'Severities exempt from ALL snooze filters — an escalation safety rail (e.g. "critical", "emergency") so a broad maintenance filter can never silence an escalation. Recoveries/closes of existing alerts are already protected automatically and do not need to be listed. Case-insensitive.'
        default_value: []
        placeholder: 'severity name'
        group: 'general'
    notification_freq:
        display_name: 'Notification frequency'
        component: 'String'
        description: 'Duration to wait before sending the next notification (Go duration string, e.g. "60s", "5m", "1h").'
        default_value: '60s'
        group: 'notification'
    notification_retry:
        display_name: 'Notification retry'
        component: 'Number'
        description: 'Number of times to retry sending a failed notification.'
        default_value: 3
        group: 'notification'
    notification.delivery_log:
        display_name: 'Delivery log'
        component: 'Switch'
        description: 'Record one row per send in the notificationlog collection — action, notifier, status, duration and a snapshot of the alert(s) covered — so every notification, action and alert can show its delivery history. Turn off on write-constrained deployments; the per-action outcome stamps and hit counters are unaffected. Takes effect immediately, no restart needed.'
        default_value: true
        group: 'notification'
    # --- LDAP ----------------------------------------------------------------
    ldap.enabled:
        display_name: 'LDAP enabled'
        component: 'Switch'
        description: 'Enable LDAP authentication.'
        default_value: false
        group: 'ldap'
    ldap.host:
        display_name: 'LDAP host'
        component: 'String'
        description: 'LDAP server URL (e.g. ldaps://ldap.example.com).'
        default_value: ''
        group: 'ldap'
    ldap.port:
        display_name: 'LDAP port'
        component: 'Number'
        description: 'LDAP port (389 for ldap, 636 for ldaps).'
        default_value: 636
        group: 'ldap'
    ldap.bind_dn:
        display_name: 'LDAP bind DN'
        component: 'String'
        description: 'Distinguished name used to bind to the directory.'
        default_value: ''
        group: 'ldap'
    ldap.bind_password:
        display_name: 'LDAP bind password'
        component: 'Password'
        description: 'Bind credentials.'
        default_value: ''
        group: 'ldap'
    ldap.base_dn:
        display_name: 'LDAP base DN'
        component: 'String'
        description: 'Search base for users; separate multiple DNs with semicolons.'
        default_value: ''
        group: 'ldap'
    ldap.user_filter:
        display_name: 'LDAP user filter'
        component: 'String'
        description: 'LDAP search filter for users (e.g. (objectClass=posixAccount)).'
        default_value: ''
        group: 'ldap'
    ldap.display_name_attribute:
        display_name: 'LDAP display name attribute'
        component: 'String'
        description: 'User attribute used as display name.'
        default_value: 'cn'
        group: 'ldap'
    ldap.email_attribute:
        display_name: 'LDAP email attribute'
        component: 'String'
        description: 'User attribute used as email.'
        default_value: 'mail'
        group: 'ldap'
    ldap.member_attribute:
        display_name: 'LDAP member attribute'
        component: 'String'
        description: 'Group membership attribute on the user entry.'
        default_value: 'memberof'
        group: 'ldap'
    ldap.group_dn:
        display_name: 'LDAP group DN'
        component: 'String'
        description: 'Base DN for groups.'
        default_value: ''
        group: 'ldap'
    # --- OIDC (Microsoft 365 / Entra ID) -------------------------------------
    # The client_secret is intentionally NOT exposed here: it stays a file/env
    # secret (oidc.yaml client_secret / SNOOZE_SERVER_OIDC_CLIENT_SECRET). The
    # login method ("microsoft") is also fixed in file-config. Map auth-backend
    # groups (App Roles) to Snooze roles on the Roles page.
    oidc.enabled:
        display_name: 'OIDC enabled'
        component: 'Switch'
        description: 'Enable OpenID Connect (Microsoft 365 / Entra) single sign-on.'
        default_value: false
        group: 'oidc'
    oidc.issuer:
        display_name: 'Issuer URL'
        component: 'String'
        description: 'OIDC issuer (e.g. https://login.microsoftonline.com/<tenant>/v2.0). Must be https.'
        default_value: ''
        group: 'oidc'
    oidc.client_id:
        display_name: 'Client ID'
        component: 'String'
        description: 'Application (client) ID registered with the identity provider.'
        default_value: ''
        group: 'oidc'
    oidc.redirect_url:
        display_name: 'Redirect URL'
        component: 'String'
        description: 'Absolute callback URL; must be registered as a Redirect URI on the IdP (…/api/v1/login/microsoft/callback).'
        default_value: ''
        group: 'oidc'
    oidc.scopes:
        display_name: 'Scopes'
        component: 'String'
        description: 'Space-separated OAuth scopes requested at sign-in.'
        default_value: 'openid profile email'
        group: 'oidc'
    oidc.roles_claim:
        display_name: 'Roles claim'
        component: 'String'
        description: 'ID-token claim carrying App Roles, mapped to Snooze roles via the Roles page Groups field.'
        default_value: 'roles'
        group: 'oidc'
    oidc.groups_claim:
        display_name: 'Groups claim'
        component: 'String'
        description: 'Optional second ID-token claim carrying group memberships.'
        default_value: 'groups'
        group: 'oidc'
    # --- Housekeeping --------------------------------------------------------
    housekeeping.trigger_on_startup:
        display_name: 'Trigger on startup'
        component: 'Switch'
        description: 'Run cleanup jobs once at startup.'
        default_value: false
        group: 'housekeeping'
    housekeeping.record_ttl:
        display_name: 'Record TTL'
        component: 'String'
        description: 'Time-to-live for alerts (Go duration). Set 0 to disable.'
        default_value: '48h'
        group: 'housekeeping'
    housekeeping.cleanup_alert:
        display_name: 'Alert cleanup interval'
        component: 'String'
        description: 'Interval between alert cleanup runs (Go duration string).'
        default_value: '5m'
        group: 'housekeeping'
    housekeeping.cleanup_comment:
        display_name: 'Comment cleanup interval'
        component: 'String'
        description: 'Interval between orphan-comment cleanup runs (Go duration string).'
        default_value: '24h'
        group: 'housekeeping'
    housekeeping.cleanup_snooze:
        display_name: 'Snooze cleanup interval'
        component: 'String'
        description: 'Interval between expired-snooze cleanup runs (Go duration string).'
        default_value: '72h'
        group: 'housekeeping'
    housekeeping.cleanup_notification:
        display_name: 'Notification cleanup interval'
        component: 'String'
        description: 'Interval between expired-notification cleanup runs (Go duration string).'
        default_value: '72h'
        group: 'housekeeping'
    housekeeping.cleanup_notificationlog:
        display_name: 'Delivery log retention'
        component: 'String'
        description: 'Retention window for notification delivery-history rows (Go duration string, e.g. "720h" = 30d).'
        default_value: '720h'
        group: 'housekeeping'
    housekeeping.cleanup_audit:
        display_name: 'Audit retention'
        component: 'String'
        description: 'Retention window for audit log entries (Go duration string).'
        default_value: '672h'
        group: 'housekeeping'
    housekeeping.cleanup_stats:
        display_name: 'Stats retention'
        component: 'String'
        description: 'Retention window for dashboard stat counters (Go duration string, e.g. "9600h" = 400d).'
        default_value: '9600h'
        group: 'housekeeping'
    housekeeping.cleanup_orphans:
        display_name: 'Orphan cleanup interval'
        component: 'String'
        description: 'Interval between orphan-rule cleanup runs (Go duration string).'
        default_value: '24h'
        group: 'housekeeping'
    housekeeping.ack_timeout:
        display_name: 'Ack timeout'
        component: 'String'
        description: 'How long an acknowledgement holds before the alert reverts to open (Go duration string, e.g. "24h"). The minute-cadence sweep enforces it.'
        default_value: '24h'
        group: 'housekeeping'
    housekeeping.escalate_after:
        display_name: 'Escalate after'
        component: 'String'
        description: 'How long an unacknowledged open alert may sit before auto-escalating to esc and re-notifying (Go duration string). Set 0 to disable auto-escalation.'
        default_value: '0s'
        group: 'housekeeping'
    housekeeping.shelve_timeout:
        display_name: 'Shelve timeout'
        component: 'String'
        description: 'Default length of a timed shelve, used when the shelve comment does not name its own duration (Go duration string, e.g. "4h"). A shelve posted from the UI carries the window the operator picked and overrides this; the minute-cadence sweep enforces whichever deadline was stamped. Does not affect the legacy permanent shelve.'
        default_value: '4h'
        group: 'housekeeping'
    # --- Ingest ---------------------------------------------------------------
    ingest.allow:
        display_name: 'Alert intake enabled'
        component: 'Switch'
        description: >-
            Master kill-switch for alert ingestion. When disabled, every
            POST /api/v1/alerts and every webhook receiver returns 503 Service
            Unavailable immediately — useful during an alert flood or a
            planned maintenance window. Per-tenant; toggling one tenant does
            not affect others. Changes take effect within the runtime-settings
            cache window (≤ 5 seconds). Fails open: a transient DB error
            never locks you out.
        default_value: true
        danger: true
        group: 'ingest'
    # --- Console (web-console defaults, served at GET /api/v1/config) ---------
    # These keys live in the runtime ``console`` settings section and overlay
    # the server's code defaults (internal/api/routes_config.go). The endpoint
    # is public and presentation-only; custom severities are placed by rank
    # (severity_ranks) and inherit a theme-aware colour automatically — there is
    # deliberately no per-label colour map.
    refresh_interval:
        display_name: 'Auto-refresh interval (seconds)'
        component: 'Number'
        description: 'How often the alerts list auto-refreshes, in seconds.'
        default_value: 5
        group: 'console'
    sort_by:
        display_name: 'Default sort'
        component: 'String'
        description: 'Default alert-list sort field; prefix with "-" for descending (e.g. "-date_epoch").'
        default_value: '-date_epoch'
        group: 'console'
    default_filter:
        display_name: 'Default filter'
        component: 'String'
        description: 'Saved-search expression applied to the alerts list by default. Empty shows everything.'
        default_value: ''
        group: 'console'
    columns:
        display_name: 'Alert table columns'
        component: 'Arguments'
        description: 'Ordered column ids shown in the alert list. Also available but off the default layout: process, source.'
        default_value: ['severity', 'message', 'hits', 'state', 'date_epoch', 'host', 'environment', 'ttl']
        placeholder: 'column id'
        group: 'console'
    severity_ranks:
        display_name: 'Severity rank ladder'
        component: 'Object'
        description: 'Label → rank map (0 = most severe). Merged key-by-key onto the built-in ladder; add a custom severity by giving it a rank (e.g. {"p1": 2}) so it sorts and colours like criticals. Colours are CSS theme tokens, not configured here.'
        default_value: {}
        group: 'console'
    logo:
        display_name: 'Logo'
        component: 'String'
        description: 'Logo image URL or data: URI shown in the web console. Empty uses the bundled Snooze logo. Prefer a URL — data URIs bloat the public config blob.'
        default_value: ''
        group: 'console'
    title:
        display_name: 'Console title'
        component: 'String'
        description: 'Browser/app title shown in the web console. Empty uses the default.'
        default_value: ''
        group: 'console'
    audio:
        display_name: 'New-alert audio cue'
        component: 'String'
        description: 'URL of an audio cue played when a new alert arrives. Empty disables the cue.'
        default_value: ''
        group: 'console'
    clipboard_template:
        display_name: 'Clipboard template'
        component: 'String'
        description: 'Template used by the copy-to-clipboard action on an alert. Empty uses the default.'
        default_value: ''
        group: 'console'
    # --- Tenant routing --------------------------------------------------------
    tenant_match.fail_closed:
        display_name: 'Fail closed on no match'
        component: 'Switch'
        description: >-
          When enabled, a user whose identity matches no routing rule (and did not
          supply an explicit org) is denied login instead of falling through to the
          default organisation. Recommended: enable only after all routing rules are
          defined. Default: off (open / fall-through).
        default_value: false
        group: 'tenant_routing'
